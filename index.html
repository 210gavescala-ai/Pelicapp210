<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Esquadrão Pelicano — Painel Operacional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#10151b; --surface:#1a222b; --surface-raised:#212b35; --border:#2c3846;
    --text:#e9eef3; --text-muted:#8fa0b0; --text-dim:#5f6f7e;
    --amber:#e8a33d; --amber-dim:#7a5a26; --teal:#4fc1b0; --teal-dim:#28564e;
    --danger:#e2645a; --danger-dim:#5c2c28;
    --font-head:'Space Grotesk', -apple-system, sans-serif;
    --font-body:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono:'IBM Plex Mono', 'SFMono-Regular', Menlo, monospace;
    --radius:3px;
  }
  :root:not([data-theme="light"]){ }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ } }
  :root[data-theme="dark"]{ }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body);
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--amber-dim); color:#fff;}
  a{color:var(--teal);}
  button{font-family:var(--font-body); cursor:pointer;}
  input,select,textarea{font-family:var(--font-body); color:var(--text); background:var(--surface-raised); border:1px solid var(--border); border-radius:var(--radius); padding:9px 10px; font-size:14.5px;}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--teal); outline-offset:1px;}
  label{display:block; font-size:12.5px; color:var(--text-muted); margin-bottom:5px;}
  .field{margin-bottom:14px;}
  .mono{font-family:var(--font-mono);}

  #app{min-height:100%; display:flex; flex-direction:column;}

  /* ---------- Gate screen ---------- */
  .gate{min-height:100vh; min-height:100%; display:flex; align-items:center; justify-content:center; padding:24px;}
  .gate-card{width:100%; max-width:420px;}
  .gate-mark{font-family:var(--font-head); font-weight:700; font-size:15px; letter-spacing:.04em; color:var(--amber); margin-bottom:6px;}
  .gate-title{font-family:var(--font-head); font-weight:600; font-size:26px; margin:0 0 28px; line-height:1.25;}
  @keyframes pulse-splash{ 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.75; transform:scale(.96);} }
  .profile-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:13px 14px; background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--teal); border-radius:var(--radius); margin-bottom:8px;}
  .profile-row .pname{font-weight:600; font-size:15px;}
  .profile-row .prole{font-family:var(--font-mono); font-size:11.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.03em;}
  .btn{border:1px solid var(--border); background:var(--surface-raised); color:var(--text); padding:9px 14px; border-radius:var(--radius); font-size:14px; font-weight:500;}
  .btn:hover{border-color:var(--text-dim);}
  .btn-amber{background:var(--amber); border-color:var(--amber); color:#241a08; font-weight:600;}
  .btn-amber:hover{background:#f0b355;}
  .btn-ghost{background:transparent; border-color:transparent; color:var(--text-muted);}
  .btn-ghost:hover{color:var(--text);}
  .btn-danger{background:transparent; border-color:var(--danger-dim); color:var(--danger);}
  .btn-danger:hover{background:var(--danger-dim);}
  .btn-sm{padding:6px 10px; font-size:12.5px;}
  .empty-note{color:var(--text-muted); font-size:13.5px; padding:14px 0;}

  /* ---------- Shell ---------- */
  .shell{display:flex; flex:1; min-height:100vh;}
  .sidebar{width:230px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:18px 0;}
  .sidebar-mark{padding:0 18px 18px; border-bottom:1px solid var(--border); margin-bottom:10px;}
  .sidebar-mark .tag{font-family:var(--font-head); font-weight:700; font-size:14px; color:var(--amber); letter-spacing:.03em;}
  .sidebar-mark .sub{font-family:var(--font-mono); font-size:10.5px; color:var(--text-dim); letter-spacing:.06em; margin-top:2px;}
  .nav-item{display:flex; align-items:center; gap:10px; padding:11px 18px; border-left:3px solid transparent; color:var(--text-muted); font-size:14px; font-weight:500;}
  .nav-item .dot{width:6px; height:6px; border-radius:50%; background:var(--text-dim); flex-shrink:0;}
  .nav-item:hover{color:var(--text); background:rgba(255,255,255,.02);}
  .nav-item.active{color:var(--text); border-left-color:var(--amber); background:rgba(232,163,61,.06);}
  .nav-item.active .dot{background:var(--amber);}
  .sidebar-foot{margin-top:auto; padding:14px 18px 0; border-top:1px solid var(--border);}
  .who{font-size:13px;}
  .who .n{font-weight:600;}
  .who .r{font-family:var(--font-mono); font-size:10.5px; color:var(--text-muted); text-transform:uppercase; display:block; margin-top:1px;}
  .switch-link{background:none; border:none; color:var(--text-dim); font-size:12px; padding:8px 0 0; text-decoration:underline;}

  .main{flex:1; min-width:0; padding:28px 34px 60px; overflow-x:hidden;}
  .view-head{margin-bottom:24px;}
  .view-eyebrow{font-family:var(--font-mono); font-size:11px; color:var(--teal); letter-spacing:.08em; margin-bottom:4px;}
  .view-title{font-family:var(--font-head); font-weight:600; font-size:24px; margin:0;}
  .view-desc{color:var(--text-muted); font-size:14px; margin-top:6px; max-width:560px;}

  .panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-bottom:22px;}
  details.panel{padding:0;}
  details.panel summary::-webkit-details-marker{display:none;}
  details.panel summary::marker{content:'';}
  details.panel[open] .toggle-chevron{transform:rotate(180deg); display:inline-block;}
  .panel h3{font-family:var(--font-head); font-size:15.5px; margin:0 0 16px; font-weight:600;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;}
  @media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr;}}

  .checks{display:flex; flex-wrap:wrap; gap:8px;}
  .check-chip{display:flex; align-items:center; gap:6px; padding:7px 11px; background:var(--surface-raised); border:1px solid var(--border); border-radius:20px; font-size:13px;}
  .check-chip input{width:14px; height:14px; padding:0;}

  /* Flight-strip style rows */
  .strip{display:flex; align-items:center; gap:16px; padding:12px 14px; background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--teal); border-radius:var(--radius); margin-bottom:7px; flex-wrap:wrap;}
  .strip.pending{border-left-color:var(--amber);}
  .strip.off{border-left-color:var(--danger);}
  .strip .sc{font-family:var(--font-mono); font-size:13px;}
  .strip .sc-lg{font-weight:600; font-size:14.5px;}
  .strip .sc-label{display:block; font-family:var(--font-body); font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; margin-bottom:2px;}
  .strip .spacer{flex:1;}
  .strip .actions{display:flex; gap:6px;}

  table.data{width:100%; border-collapse:collapse; font-size:13.5px;}
  table.data th{text-align:left; font-family:var(--font-mono); font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; padding:8px 10px; border-bottom:1px solid var(--border);}
  table.data td{padding:9px 10px; border-bottom:1px solid var(--border); font-family:var(--font-mono);}
  table.data tr:last-child td{border-bottom:none;}

  .tabs{display:flex; gap:4px; margin-bottom:18px; border-bottom:1px solid var(--border);}
  .tab{padding:9px 4px; margin-right:18px; color:var(--text-muted); font-size:14px; font-weight:500; border-bottom:2px solid transparent; background:none; border-top:none; border-left:none; border-right:none;}
  .tab.active{color:var(--text); border-bottom-color:var(--amber);}

  .step-pick{display:flex; flex-wrap:wrap; gap:10px;}
  .pick-card{padding:14px 18px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); text-align:left; min-width:150px;}
  .pick-card:hover{border-color:var(--teal);}
  .pick-card .m{font-family:var(--font-head); font-weight:600; font-size:15px;}
  .pick-card .n{font-family:var(--font-mono); font-size:11.5px; color:var(--text-muted); margin-top:3px;}

  .kpi-row{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:22px;}
  .kpi{flex:1; min-width:140px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px;}
  .kpi .v{font-family:var(--font-head); font-size:26px; font-weight:700; color:var(--amber);}
  .kpi .l{font-size:12px; color:var(--text-muted); margin-top:2px;}

  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--surface-raised); border:1px solid var(--teal); color:var(--text); padding:11px 18px; border-radius:var(--radius); font-size:13.5px; box-shadow:0 6px 20px rgba(0,0,0,.4); z-index:50; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

  .segmented{display:flex; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; width:fit-content;}
  .segmented button{border:none; background:var(--surface); color:var(--text-muted); padding:7px 13px; font-size:12.5px; border-right:1px solid var(--border);}
  .segmented button:last-child{border-right:none;}
  .segmented button.active{background:var(--surface-raised); color:var(--amber); font-weight:600;}

  .mobile-topbar{display:none;}

  .crew-details summary{list-style:none;}
  .crew-details summary::-webkit-details-marker{display:none;}
  .crew-details summary::before{content:'▸ '; color:var(--amber); font-size:11px;}
  .crew-details[open] summary::before{content:'▾ '; }
  .crew-details summary:hover{color:var(--text) !important;}
  @media(max-width:820px){
    .shell{flex-direction:column;}
    .sidebar{width:100%; flex-direction:row; align-items:center; padding:10px 12px; overflow-x:auto; gap:2px;}
    .sidebar-mark{display:none;}
    .sidebar-foot{display:none;}
    .nav-item{flex-shrink:0; padding:9px 12px; border-left:none; border-bottom:3px solid transparent;}
    .nav-item.active{border-left:none; border-bottom-color:var(--amber);}
    .main{padding:20px 16px 50px;}
    .mobile-topbar{display:flex; justify-content:space-between; align-items:center; padding:10px 16px; padding-top:calc(10px + env(safe-area-inset-top,0px)); background:var(--surface); border-bottom:1px solid var(--border); position:relative;}
    .mobile-account-menu summary{cursor:pointer; list-style:none; color:var(--text-muted); font-size:13px; padding:4px 8px;}
    .mobile-account-menu summary::-webkit-details-marker{display:none;}
    .mobile-account-panel{position:absolute; right:12px; top:100%; margin-top:4px; background:var(--surface-raised); border:1px solid var(--border); border-radius:var(--radius); padding:10px 14px; z-index:30; white-space:nowrap; box-shadow:0 8px 20px rgba(0,0,0,.4); display:flex; flex-direction:column; gap:8px;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
  "use strict";

  /* ---------------- State ---------------- */
  var S = {
    db: null,
    downloads: null,
    ready: false,
    profileId: localStorage.getItem('ep_profile_id') || null,
    view: 'registro',
    data: { profiles: [], models: [], aircraft: [], flights: [], unavail: [], orders: [], effortBudgets: [], modelEfforts: [], customAirports: [], orderReports: [], soldos: [], escalasVoo: [] },
    fx: { modelId: null, aircraftId: null }, // registro de voo wizard
    adminTab: 'perfis',
    esforcoTab: 'alocacao',
    effortYear: new Date().getFullYear(),
    effortModelId: null,
    effortPending: {},
  };

  var FUNCOES_POR_MODELO = {
    'SC-105': ['PLT','MC','OE-3','OS'],
    'H-60L': ['PLT','MC','OE-5','HSAR']
  };
  var FUNCOES_ADMIN = ['ADM','CMT','OPR']; // cargos de esquadrão, não ligados a uma aeronave específica
  var FUNCOES_ALL = ['PLT','MC','OE-3','OE-5','OS','HSAR'].concat(FUNCOES_ADMIN); // lista cheia, para filtros que não são por aeronave
  function modelKeyFromName_(name){
    var n = (name||'').toUpperCase();
    if(n.indexOf('H-60')!==-1 || n.indexOf('H60')!==-1) return 'H-60L';
    return 'SC-105';
  }
  function funcoesForModelId_(modelId){
    var m = byId(S.data.models, modelId);
    return m ? (FUNCOES_POR_MODELO[modelKeyFromName_(m.name)] || []) : [];
  }
  function profileFuncoesOnModel_(p, modelId){
    if(p.funcoesPorModelo && p.funcoesPorModelo[modelId]) return p.funcoesPorModelo[modelId];
    // compatibilidade com perfis antigos (função única, não separada por modelo)
    if(p.funcoes && (p.aircraftModelIds||[]).indexOf(modelId)!==-1){
      var validList = funcoesForModelId_(modelId);
      return p.funcoes.filter(function(f){ return validList.indexOf(f)!==-1; });
    }
    return [];
  }
  function profileHasFuncaoOnModel_(p, funcao, modelId){
    return profileFuncoesOnModel_(p, modelId).indexOf(funcao) !== -1;
  }
  function profileFuncoesAdmin_(p){
    if(p.funcoesAdmin) return p.funcoesAdmin;
    return (p.funcoes||[]).filter(function(f){ return FUNCOES_ADMIN.indexOf(f)!==-1; }); // compatibilidade
  }
  function profileHasFuncaoAdmin_(p, funcao){
    return profileFuncoesAdmin_(p).indexOf(funcao) !== -1;
  }
  function profileHasFuncaoAny_(p, funcao){
    if(FUNCOES_ADMIN.indexOf(funcao)!==-1) return profileHasFuncaoAdmin_(p, funcao);
    return (p.aircraftModelIds||[]).some(function(mid){ return profileHasFuncaoOnModel_(p, funcao, mid); });
  }
  function profileFuncoesDisplay_(p){
    var parts = (p.aircraftModelIds||[]).map(function(mid){
      var m = byId(S.data.models, mid);
      var fs = profileFuncoesOnModel_(p, mid);
      return (m && fs.length) ? (m.name+': '+fs.join('/')) : null;
    }).filter(Boolean);
    var admin = profileFuncoesAdmin_(p);
    if(admin.length) parts.push(admin.join('/'));
    return parts.length ? parts.join(' · ') : '—';
  }

  // monta um bloco de checkboxes de função para cada modelo marcado, mais um bloco fixo de funções administrativas
  function funcaoBlocksHtml_(modelIds, funcoesPorModelo, funcoesAdmin, disabled){
    funcoesPorModelo = funcoesPorModelo || {};
    funcoesAdmin = funcoesAdmin || [];
    var modelBlocks = (modelIds||[]).map(function(mid){
      var m = byId(S.data.models, mid);
      if(!m) return '';
      var list = funcoesForModelId_(mid);
      var selected = funcoesPorModelo[mid] || [];
      return '<div class="funcmodelo-block" data-model-id="'+mid+'" style="margin-bottom:10px;">'
        + '<div style="font-family:var(--font-head); font-size:12px; color:var(--text-muted); margin-bottom:6px;">Função em '+esc(m.name)+'</div>'
        + '<div class="checks">' + list.map(function(f){
            var checked = selected.indexOf(f)!==-1 ? ' checked' : '';
            return '<label class="check-chip"><input type="checkbox" value="'+f+'"'+checked+(disabled?' disabled':'')+'> '+f+'</label>';
          }).join('') + '</div></div>';
    }).join('');
    var adminBlock = '<div class="funcmodelo-block" data-model-id="__admin" style="margin-bottom:10px;">'
      + '<div style="font-family:var(--font-head); font-size:12px; color:var(--text-muted); margin-bottom:6px;">Funções administrativas (esquadrão)</div>'
      + '<div class="checks">' + FUNCOES_ADMIN.map(function(f){
          var checked = funcoesAdmin.indexOf(f)!==-1 ? ' checked' : '';
          return '<label class="check-chip"><input type="checkbox" value="'+f+'"'+checked+(disabled?' disabled':'')+'> '+f+'</label>';
        }).join('') + '</div></div>';
    return modelBlocks + adminBlock;
  }
  function readFuncaoBlocks_(root){
    var funcoesPorModelo = {}, funcoesAdmin = [];
    root.querySelectorAll('.funcmodelo-block').forEach(function(block){
      var mid = block.getAttribute('data-model-id');
      var vals = Array.from(block.querySelectorAll('input:checked')).map(function(c){return c.value;});
      if(mid==='__admin') funcoesAdmin = vals; else if(vals.length) funcoesPorModelo[mid] = vals;
    });
    return { funcoesPorModelo: funcoesPorModelo, funcoesAdmin: funcoesAdmin };
  }
  function wireFuncaoModelBlocks(root, wrapId, modeloFieldName, disabled){
    function recompute(){
      var modelIds = Array.from(root.querySelectorAll('[name="'+modeloFieldName+'"]:checked')).map(function(c){return c.value;});
      var existing = readFuncaoBlocks_(root);
      var wrap = root.querySelector('#'+wrapId);
      if(wrap) wrap.innerHTML = funcaoBlocksHtml_(modelIds, existing.funcoesPorModelo, existing.funcoesAdmin, disabled);
    }
    root.querySelectorAll('[name="'+modeloFieldName+'"]').forEach(function(cb){
      cb.addEventListener('change', recompute);
    });
  }
  var POSTOS = ['TC','MJ','CP','1T','2T','SO','1S','2S','3S','CB'];

  /* ---------------- Diárias / Custeio ---------------- */
  // Tabela oficial: [Brasília/Manaus/Rio de Janeiro/São Paulo, outras capitais de Estado, demais deslocamentos]
  var DIARIA_TABLE = {
    A: [800, 700, 650], // Comandantes das Forças / cargos de Natureza Especial
    B: [600, 515, 455], // Oficiais-Generais
    C: [510, 450, 395], // Oficiais-Superiores
    D: [425, 380, 335], // Oficiais-Intermediários/Subalternos, Guardas-Marinha, Aspirantes a Oficial
    E: [425, 380, 335], // Suboficiais, Subtenentes, Sargentos, Aspirantes, Cadetes
    F: [355, 315, 280], // Alunos de formação de oficiais
    G: [355, 315, 280]  // Demais Praças e Praças Especiais
  };
  var POSTO_CIRCULO = {
    'TC':'C', 'MJ':'C', 'CP':'D', '1T':'D', '2T':'D',
    'SO':'E', '1S':'E', '2S':'E', '3S':'E', 'CB':'G'
  };
  var CAPITAIS_PREMIUM = ['Brasília','Manaus','Rio de Janeiro','São Paulo'];
  var CAPITAIS_ESTADO = ['Rio Branco','Maceió','Macapá','Salvador','Fortaleza','Vitória','Goiânia','São Luís',
    'Cuiabá','Campo Grande','Belo Horizonte','Belém','João Pessoa','Curitiba','Recife','Teresina',
    'Natal','Porto Alegre','Porto Velho','Boa Vista','Florianópolis','Aracaju','Palmas','Brasília','Manaus','Rio de Janeiro','São Paulo'];
  function destinoCategoria_(city){
    if(!city) return 2;
    if(CAPITAIS_PREMIUM.indexOf(city)!==-1) return 0;
    if(CAPITAIS_ESTADO.indexOf(city)!==-1) return 1;
    return 2;
  }
  function diariaValor_(posto, city){
    var circulo = POSTO_CIRCULO[posto] || 'G';
    var cat = destinoCategoria_(city);
    return (DIARIA_TABLE[circulo]||DIARIA_TABLE.G)[cat];
  }
  function cityForIcao_(icao){
    var a = findAirport(icao);
    return a ? a.city : null;
  }
  function diasEntre_(fromIso, toIso){
    if(!fromIso || !toIso) return 0;
    var a = new Date(fromIso+'T00:00:00'), b = new Date(toIso+'T00:00:00');
    if(isNaN(a.getTime())||isNaN(b.getTime())) return 0;
    return Math.round((b-a)/86400000);
  }
  function flightHasCrewMember_(f, profile){
    if(f.crew && f.crew.indexOf(profile.id)!==-1) return true;
    var tri = (profile.trigrama||'').toUpperCase();
    return ALL_CREW_SLOT_KEYS.some(function(k){ return String(f[k]||'').trim().toUpperCase()===tri; });
  }
  function parseDateTime_(dateIso, timeStr){
    if(!dateIso || !timeStr) return null;
    var d = new Date(dateIso+'T'+timeStr+':00');
    return isNaN(d.getTime()) ? null : d;
  }
  function calcularGratRep_(profile, flights){
    var withDep = (flights||[]).filter(function(f){ return f.date && f.takeoff; })
      .map(function(f){ return { f:f, dt: parseDateTime_(f.date, f.takeoff) }; }).filter(function(x){ return x.dt; })
      .sort(function(a,b){ return a.dt - b.dt; });
    var withArr = (flights||[]).filter(function(f){ return f.date && f.landing; })
      .map(function(f){ return { f:f, dt: parseDateTime_(f.date, f.landing) }; }).filter(function(x){ return x.dt; })
      .sort(function(a,b){ return b.dt - a.dt; });
    if(!withDep.length || !withArr.length) return { qtd:0, valorUnit:0, total:0, saida:null, retorno:null, elapsedH:0 };
    var saida = withDep[0].dt, retorno = withArr[0].dt;
    var elapsedH = (retorno - saida) / 3600000;
    var qtd = elapsedH >= 8 ? Math.floor((elapsedH-8)/24) + 1 : 0;
    var soldoDoc = S.data.soldos[0] || {};
    var soldo = soldoDoc[profile.posto] || 0;
    var valorUnit = soldo * 0.02;
    var total = qtd * valorUnit;
    return { qtd: qtd, valorUnit: valorUnit, total: total, saida: saida, retorno: retorno, elapsedH: elapsedH };
  }
  function calcularCusteio_(profile, entries, flights, overrideCity){
    var detalhes = [];
    var total = 0;
    (entries||[]).forEach(function(e){
      var noites = diasEntre_(e.from, e.to);
      if(noites <= 0 || !e.localidade) return;

  function findAirport(icao){

    if(builtin) return builtin;
    var custom = S.data.customAirports.find(function(a){return a.icao===icao;});
    return custom || null;
  }
  function haversineNm(lat1,lon1,lat2,lon2){
    var R = 3440.065;
    var toRad = function(d){return d*Math.PI/180;};
    var dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
    var a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)*Math.sin(dLon/2);
    var c = 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R*c;
  }
  function aircraftSpeedKt(modelName){
    var name = (modelName||'').toUpperCase();
    if(name.indexOf('H-60')!==-1 || name.indexOf('H60')!==-1) return 120;

    return null;
  }

  function wireConfirmDelete(btn, onConfirm){
    btn.addEventListener('click', function(){
      if(btn.getAttribute('data-armed') === '1'){
        clearTimeout(btn._armTimer);
        onConfirm();
      } else {
        btn.setAttribute('data-armed', '1');
        btn.setAttribute('data-label', btn.textContent);
        btn.textContent = 'Confirmar?';
        clearTimeout(btn._armTimer);
        btn._armTimer = setTimeout(function(){
          btn.removeAttribute('data-armed');
          btn.textContent = btn.getAttribute('data-label') || 'Remover';
        }, 4000);
      }
    });
  }

  function durationMinutes(dep, arr){
    if(!dep || !arr) return 0;
    var a = dep.split(':').map(Number), b = arr.split(':').map(Number);
    var am = a[0]*60+a[1], bm = b[0]*60+b[1];
    var diff = bm - am;
    if(diff < 0) diff += 24*60;
    return diff;
  }
  function fmtDuration(mins){
    var h = Math.floor(mins/60), m = mins%60;
    return h + 'h' + String(m).padStart(2,'0');
  }
  function fmtHHh(s){
    if(!s) return s;
    var parts = String(s).split(':');
    if(parts.length < 2) return s;
    var h = parseInt(parts[0],10);
    if(isNaN(h)) return s;
    return h + 'h' + parts[1].padStart(2,'0');
  }
  function fmtHoursDecimal(hoursDecimal){
    var neg = hoursDecimal < 0;
    var totalMin = Math.round(Math.abs(hoursDecimal) * 60);
    var h = Math.floor(totalMin/60), m = totalMin%60;
    return (neg?'-':'') + h + 'h' + String(m).padStart(2,'0');
  }
  function parseHoursInput_(str){
    str = String(str||'').trim();
    if(!str) return 0;
    var neg = str.charAt(0)==='-';
    if(neg) str = str.slice(1);
    if(str.indexOf('h')!==-1){
      var parts = str.split('h');
      var h = parseInt(parts[0],10) || 0;
      var m = parseInt(parts[1],10) || 0;
      var val = h + m/60;
      return neg ? -val : val;
    }
    var num = parseFloat(str.replace(',','.'));
    if(isNaN(num)) return 0;
    return neg ? -num : num;
  }

        + '<button class="btn btn-amber" type="submit" style="width:100%;">Entrar</button>'
        + '<p class="empty-note" style="margin-top:10px;">Esqueceu a senha? Peça para um perfil de Administração redefinir em Administrador → Perfis.</p>'
        + '</form>'

        e.preventDefault();
        try{
          var fd = new FormData(e.target);

          var senha = (fd.get('senha')||'').trim();
          var p = S.data.profiles.find(function(x){ return (x.trigrama||'').trim().toUpperCase()===tri; });
          if(!p){ toast('Trigrama "'+tri+'" não encontrado.'); return; }
          var senhaCerta = String(p.senha||DEFAULT_PASSWORD).trim();
          if(senhaCerta !== senha){ toast('Senha incorreta para '+tri+'.'); return; }
          S.profileId = p.id; localStorage.setItem('ep_profile_id', S.profileId); render();
        }catch(err){
          toast('Erro no login: '+(err && err.message ? err.message : err));
        }
      });
      return;
    }

    app.innerHTML =
      '<div class="gate"><div class="gate-card">'
      + '<div class="gate-mark">ESQUADRÃO PELICANO</div>'
      + '<h1 class="gate-title">Criar primeiro perfil</h1>'
      + '<p class="empty-note">Nenhum perfil cadastrado ainda. Crie o primeiro abaixo — a senha inicial será <strong class="mono">'+DEFAULT_PASSWORD+'</strong> (pode ser trocada depois).</p>'
      + '<form id="gate-form">'
      + '<div class="grid2">'
      + '<div class="field"><label>Nome completo</label><input name="name" required placeholder="Nome completo"></div>'
      + '<div class="field"><label>Nome de guerra</label><input name="nomeGuerra" required placeholder="Ex.: CRAVO"></div>'
      + '</div>'
      + '<div class="grid2">'
      + '<div class="field"><label>Trigrama</label><input name="trigrama" required maxlength="3" minlength="3" placeholder="Ex.: ABC" style="text-transform:uppercase;"></div>'
      + '<div class="field"><label>Posto/Graduação</label><select name="posto" required><option value="">Selecione…</option>'+POSTOS.map(function(p){return '<option value="'+p+'">'+p+'</option>';}).join('')+'</select></div>'
      + '</div>'
      + (S.data.models.length ? '<div class="field"><label>Modelo(s) de aeronave que tripula</label><div class="checks">'+modelChecks('modelos')+'</div></div>' : '')
      + '<div class="field"><label>Função(ões)</label><div id="funcmodelo-wrap-gate">'+funcaoBlocksHtml_([], {}, [], false)+'</div></div>'
      + '<button class="btn btn-amber" type="submit" style="width:100%; margin-top:6px;">Criar e entrar</button>'
      + '</form>'
      + '</div></div>';

    wireFuncaoModelBlocks(document, 'funcmodelo-wrap-gate', 'modelos', false);

    var f = document.getElementById('gate-form');
    if(f) f.addEventListener('submit', function(e){
      e.preventDefault();
      var fd = new FormData(f);
      var tri = fd.get('trigrama').trim().toUpperCase();
      if(!/^[A-Z]{3}$/.test(tri)){ toast('O trigrama deve ter exatamente 3 letras.'); return; }
      if(trigramTaken(tri)){ toast('Esse trigrama já está em uso.'); return; }
      var funcaoData = readFuncaoBlocks_(f);
      var modelos = Array.from(f.querySelectorAll('[name="modelos"]:checked')).map(function(c){return c.value;});
      var payload = {
        name: fd.get('name').trim(), nomeGuerra: fd.get('nomeGuerra').trim(), trigrama: tri,
        posto: fd.get('posto').trim(), funcoesPorModelo: funcaoData.funcoesPorModelo, funcoesAdmin: funcaoData.funcoesAdmin,
        aircraftModelIds: modelos, senha: DEFAULT_PASSWORD, createdAt: Date.now()
      };
      S.db.collection('profiles').add(payload)
        .then(function(ref){
          S.profileId = ref.id; localStorage.setItem('ep_profile_id', S.profileId);
          S.data.profiles.push(Object.assign({id: ref.id}, payload)); // atualização local otimista, não espera o próximo polling
          render(); toast('Perfil criado.');
        })
        .catch(function(){ toast('Não foi possível salvar. Tente novamente.'); });
    });
  }

  function renderAdminPerfis(body){
    var me = byId(S.data.profiles, S.profileId);
    var isAdm = !!(me && profileHasFuncaoAdmin_(me, 'ADM'));
    var editing = S.editingProfileId ? byId(S.data.profiles, S.editingProfileId) : null;
    if(S.editingProfileId && !editing) S.editingProfileId = null; // was deleted elsewhere
    var isEditingSelf = editing && editing.id === S.profileId;
    var canEditForm = isAdm || isEditingSelf; // só ADM cadastra gente nova; qualquer um edita o próprio

    function buildProfileRows(filterTerm){
      var term = (filterTerm||'').trim().toUpperCase();
      var list = S.data.profiles.slice().sort(function(a,b){return (a.name||'').localeCompare(b.name||'');});
      if(term){
        list = list.filter(function(p){
          return (p.trigrama||'').toUpperCase().indexOf(term)!==-1
            || (p.name||'').toUpperCase().indexOf(term)!==-1
            || (p.nomeGuerra||'').toUpperCase().indexOf(term)!==-1;
        });
      }
      return list.map(function(p){
        var actions = isAdm
          ? ('<button class="btn btn-sm" data-edit-profile="'+p.id+'">Editar</button> '
            + '<button class="btn btn-sm" data-reset-pw="'+p.id+'">Redefinir senha</button> '
            + '<button class="btn btn-danger btn-sm" data-del-profile="'+p.id+'">Remover</button>')
          : (p.id === S.profileId ? '<span class="mono" style="color:var(--text-dim); font-size:11px;">(você)</span>' : '');
        return '<tr><td class="mono" style="color:var(--amber); font-weight:600;">'+esc(p.trigrama||'—')+'</td>'
          + '<td class="mono">'+esc(p.nomeGuerra||'—')+'</td>'
          + '<td class="mono">'+esc(p.name)+'</td>'
          + '<td class="mono">'+esc(p.posto||'—')+'</td>'
          + '<td class="mono">'+esc(profileFuncoesDisplay_(p))+'</td>'
          + '<td class="mono">'+esc(profileModelNames(p.id))+'</td>'
          + '<td style="text-align:right; white-space:nowrap;">'+actions+'</td></tr>';
      }).join('');
    }
    function wireProfileRowActions(container){
      container.querySelectorAll('[data-edit-profile]').forEach(function(b){
        b.addEventListener('click', function(){ S.editingProfileId = b.getAttribute('data-edit-profile'); renderAdminPerfis(body); window.scrollTo({top:0, behavior:'smooth'}); });
      });
      container.querySelectorAll('[data-reset-pw]').forEach(function(b){
        wireConfirmDelete(b, function(){
          S.db.collection('profiles').doc(b.getAttribute('data-reset-pw')).update({senha: DEFAULT_PASSWORD})
            .then(function(){ toast('Senha redefinida para '+DEFAULT_PASSWORD+'.'); })
            .catch(function(){ toast('Erro ao redefinir senha.'); });
        });
      });
      container.querySelectorAll('[data-del-profile]').forEach(function(b){
        wireConfirmDelete(b, function(){
          var id = b.getAttribute('data-del-profile');
          if(id === S.profileId){ toast('Você não pode remover seu próprio perfil ativo.'); return; }
          if(S.editingProfileId === id) S.editingProfileId = null;
          S.db.collection('profiles').doc(id).delete().then(function(){ toast('Perfil removido.'); }).catch(function(){ toast('Erro ao remover perfil.'); });
        });
      });
    }
    var rows = buildProfileRows(S.adminPerfilSearch);

    var f = editing || {};
    var formTitle = editing ? 'Editar perfil — '+ (editing.nomeGuerra||editing.name) : 'Novo perfil / login';
    var submitLabel = editing ? 'Salvar alterações' : 'Cadastrar perfil';

    var seedFuncoesPorModelo = {};
    (f.aircraftModelIds||[]).forEach(function(mid){ seedFuncoesPorModelo[mid] = profileFuncoesOnModel_(f, mid); });

    var formHtml = !canEditForm ? '' :
      '<div class="panel"><h3>'+esc(formTitle)+'</h3><form id="form-profile">'
      + '<div class="grid2">'
      + '<div class="field"><label>Nome completo</label><input name="name" required placeholder="Nome completo" value="'+esc(f.name||'')+'"></div>'
      + '<div class="field"><label>Nome de guerra</label><input name="nomeGuerra" required placeholder="Ex.: CRAVO" value="'+esc(f.nomeGuerra||'')+'"></div>'
      + '</div>'
      + '<div class="grid2">'
      + '<div class="field"><label>Trigrama</label><input name="trigrama" required maxlength="3" minlength="3" placeholder="Ex.: ABC" style="text-transform:uppercase;" value="'+esc(f.trigrama||'')+'"'+(isAdm?'':' disabled')+'></div>'
      + '<div class="field"><label>Posto/Graduação</label><select name="posto" required'+(isAdm?'':' disabled')+'>'+postoOptions(f.posto)+'</select></div>'
      + '</div>'
      + (S.data.models.length ? '<div class="field"><label>Modelo(s) de aeronave que tripula</label><div class="checks" id="modelo-wrap-admin">'+modelChecks('modelos', f.aircraftModelIds)+'</div></div>' : '<p class="empty-note">Cadastre modelos de aeronave em Aeronaves para poder vinculá-los ao perfil.</p>')
      + '<div class="field"><label>Função(ões)'+(isAdm?'':' <span style="color:var(--text-dim); font-weight:400;">(somente ADM pode alterar)</span>')+'</label><div id="funcmodelo-wrap-admin">'+funcaoBlocksHtml_(f.aircraftModelIds||[], seedFuncoesPorModelo, profileFuncoesAdmin_(f), !isAdm)+'</div></div>'
      + '<button class="btn btn-amber" type="submit">'+submitLabel+'</button> '
      + (editing ? '<button type="button" class="btn btn-ghost" id="cancel-edit-profile">Cancelar</button>' : '')
      + '</form></div>';

    body.innerHTML = formHtml
      + (isAdm ? '' : '<p class="empty-note" style="margin-bottom:14px;">Somente perfis com função <strong>ADM</strong> podem criar ou gerenciar logins de outras pessoas. Use "editar meu perfil" na barra lateral para alterar seus próprios dados.</p>')
      + '<div class="panel"><h3 style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;">Perfis cadastrados ('+S.data.profiles.length+') <input id="profile-search" placeholder="buscar por trigrama ou nome..." value="'+esc(S.adminPerfilSearch||'')+'" style="width:240px; font-size:12.5px; padding:7px 10px;"></h3>'
      + '<div id="profile-table-wrap">'+(rows ? '<table class="data"><thead><tr><th>Trigrama</th><th>Nome de guerra</th><th>Nome</th><th>Posto/Grad.</th><th>Função(ões)</th><th>Aeronaves</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>' : '<p class="empty-note">Nenhum perfil encontrado.</p>')+'</div>'
      + '</div>';

    if(canEditForm) wireFuncaoModelBlocks(body, 'funcmodelo-wrap-admin', 'modelos', !isAdm);

    var formEl = document.getElementById('form-profile');
    if(formEl) formEl.addEventListener('submit', function(e){
      e.preventDefault();
      var fd = new FormData(e.target);
      var tri = isAdm ? fd.get('trigrama').trim().toUpperCase() : editing.trigrama;
      if(isAdm){
        if(!/^[A-Z]{3}$/.test(tri)){ toast('O trigrama deve ter exatamente 3 letras.'); return; }
        if(trigramTaken(tri, editing ? editing.id : null)){ toast('Esse trigrama já está em uso.'); return; }
      }
      var funcaoData = isAdm ? readFuncaoBlocks_(e.target) : { funcoesPorModelo: (editing.funcoesPorModelo||{}), funcoesAdmin: profileFuncoesAdmin_(editing) };
      var modelos = Array.from(e.target.querySelectorAll('[name="modelos"]:checked')).map(function(c){return c.value;});
      var payload = {
        name: fd.get('name').trim(), nomeGuerra: fd.get('nomeGuerra').trim(), trigrama: tri,
        posto: isAdm ? fd.get('posto').trim() : editing.posto,
        funcoesPorModelo: funcaoData.funcoesPorModelo, funcoesAdmin: funcaoData.funcoesAdmin, aircraftModelIds: modelos
      };
      if(editing){
        S.db.collection('profiles').doc(editing.id).update(payload)
          .then(function(){ toast('Perfil atualizado.'); S.editingProfileId = null; render(); })
          .catch(function(){ toast('Erro ao atualizar perfil.'); });
      } else if(isAdm) {
        payload.createdAt = Date.now();
        payload.senha = DEFAULT_PASSWORD;
        S.db.collection('profiles').add(payload)
          .then(function(){ toast('Perfil cadastrado. Senha inicial: '+DEFAULT_PASSWORD); e.target.reset(); })
          .catch(function(){ toast('Erro ao salvar perfil.'); });
      }
    });
    var cancelBtn = document.getElementById('cancel-edit-profile');
    if(cancelBtn) cancelBtn.addEventListener('click', function(){ S.editingProfileId = null; renderAdminPerfis(body); });

    var tableWrap = document.getElementById('profile-table-wrap');
    wireProfileRowActions(tableWrap);
    document.getElementById('profile-search').addEventListener('input', function(e){
      S.adminPerfilSearch = e.target.value;
      var newRows = buildProfileRows(S.adminPerfilSearch);
      tableWrap.innerHTML = newRows ? '<table class="data"><thead><tr><th>Trigrama</th><th>Nome de guerra</th><th>Nome</th><th>Posto/Grad.</th><th>Função(ões)</th><th>Aeronaves</th><th></th></tr></thead><tbody>'+newRows+'</tbody></table>' : '<p class="empty-note">Nenhum perfil encontrado.</p>';
      wireProfileRowActions(tableWrap);
    });
  }

  function renderAdminEsforcos(body){
    if(!S.data.models.length){ body.innerHTML = '<p class="empty-note">Cadastre um modelo de aeronave primeiro.</p>'; return; }
    if(!S.adminEsforcoModelId || !byId(S.data.models, S.adminEsforcoModelId)) S.adminEsforcoModelId = S.data.models[0].id;
    var model = byId(S.data.models, S.adminEsforcoModelId);
    var doc = byId(S.data.modelEfforts, model.id);
    var list = (doc && doc.efforts && doc.efforts.length) ? doc.efforts : MISSOES;
    var usingDefault = !(doc && doc.efforts && doc.efforts.length);

    var modelTabs = S.data.models.map(function(m){
      return '<button class="tab'+(m.id===S.adminEsforcoModelId?' active':'')+'" data-esf-model="'+m.id+'">'+esc(m.name)+'</button>';
    }).join('');

    var rows = list.map(function(e, idx){
      return '<tr><td class="mono">'+esc(e)+'</td>'
        + '<td style="text-align:right;"><button class="btn btn-danger btn-sm" data-del-esf="'+idx+'">Remover</button></td></tr>';
    }).join('');

    body.innerHTML = '<div class="tabs" style="margin-bottom:14px;">'+modelTabs+'</div>'
      + (usingDefault ? '<p class="empty-note" style="margin-bottom:14px;">Este modelo ainda usa a lista padrão de esforços. Adicionar um item abaixo cria uma lista própria para '+esc(model.name)+'.</p>' : '')
      + '<div class="panel"><h3>Novo esforço — '+esc(model.name)+'</h3><form id="form-esforco">'
      + '<div class="field"><label>Código do esforço</label><input name="code" required placeholder="Ex.: PRPO - SPREP - TAPIO"></div>'
      + '<button class="btn btn-amber" type="submit">Adicionar</button></form></div>'
      + '<div class="panel"><h3>Esforços de '+esc(model.name)+' ('+list.length+')</h3>'
      + '<table class="data"><thead><tr><th>Código</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>'
      + '</div>';

    body.querySelectorAll('[data-esf-model]').forEach(function(b){
      b.addEventListener('click', function(){ S.adminEsforcoModelId = b.getAttribute('data-esf-model'); renderAdminEsforcos(body); });
    });
    document.getElementById('form-esforco').addEventListener('submit', function(e){
      e.preventDefault();
      var code = (new FormData(e.target).get('code')||'').trim();
      if(!code) return;
      var newList = list.slice();
      if(newList.indexOf(code)!==-1){ toast('Esse esforço já está na lista.'); return; }
      newList.push(code);
      S.db.doc('modelEfforts/'+model.id).set({ modelId: model.id, modelName: model.name, efforts: newList, updatedAt: Date.now() })
        .then(function(){ toast('Esforço adicionado.'); })
        .catch(function(){ toast('Erro ao salvar.'); });
    });
    body.querySelectorAll('[data-del-esf]').forEach(function(b){
      wireConfirmDelete(b, function(){
        var idx = Number(b.getAttribute('data-del-esf'));
        var newList = list.slice(); newList.splice(idx,1);
        S.db.doc('modelEfforts/'+model.id).set({ modelId: model.id, modelName: model.name, efforts: newList, updatedAt: Date.now() })
          .then(function(){ toast('Esforço removido.'); })
          .catch(function(){ toast('Erro ao remover.'); });
      });
    });
  }

  /* ---------------- REGISTRO DE VOO ---------------- */
  function flightFormConfig(modelName){
    var name = (modelName||'').toUpperCase();
    if(name.indexOf('H-60')!==-1 || name.indexOf('H60')!==-1){
      return { tipoOptions:['M','L','S'], hasSolo:true, mcCount:4, oeCount:4,
        observerRole:'HSAR', observerLabel:'Homem SAR', observerPrefix:'sr', observerCount:8,
        missionExtra:'segPub' };
    }
    return { tipoOptions:['M','L'], hasSolo:false, mcCount:6, oeCount:4,
      observerRole:'OS', observerLabel:'Observadores SAR', observerPrefix:'os', observerCount:12,
      missionExtra:'marker' };
  }
  function profileIdByTri_(tri){
    var p = S.data.profiles.find(function(x){ return (x.trigrama||'').toUpperCase()===String(tri||'').toUpperCase(); });
    return p ? p.id : '';

  var CESTA_BASICA_POR_MODELO = {

  function flightMatchesModel_(f, modelId, modelName){
    if(f.modelId) return f.modelId === modelId;
    return modelKeyFromName_(f.modelName) === modelKeyFromName_(modelName);
  }

    var FLIGHT_CREW_KEYS = ['ni','p1','p2','mc1','mc2','mc3','mc4','mc5','mc6','oe1','oe2','oe3','oe4',
      'os1','os2','os3','os4','os5','os6','os7','os8','os9','os10','os11','os12',
      'sr1','sr2','sr3','sr4','sr5','sr6','sr7','sr8'];
    el.innerHTML = list.map(function(f){

        + '<div class="sc"><span class="sc-label">Data</span>'+fmtDate(f.date)+'</div>'

        + '<div class="sc"><span class="sc-label">Rota</span>'+esc(f.origin||'—')+' → '+esc(f.destination||'—')+'</div>'
        + '<div class="sc"><span class="sc-label">Esforço</span>'+esc(f.missionType||'—')+'</div>'

    el.querySelectorAll('[data-del-flight]').forEach(function(b){
      wireConfirmDelete(b, function(){
        var id = b.getAttribute('data-del-flight');

        op.then(function(){ toast('Voo excluído.'); if(S.editingFlightId===id) S.editingFlightId=null; })

  /* ---------------- ESFORÇO AÉREO ---------------- */
  function effortDocId(year, modelId){ return year+'_'+modelId; }

  async function ensureEffortDoc(year, modelId, modelName){
    var docId = effortDocId(year, modelId);
    var ref = S.db.doc('effortBudgets/'+docId);
    var snap = await ref.get();
    if(snap.exists) return;
    var effortsList = effortsForModel(modelId, modelName);
    var hours = {};
    effortsList.forEach(function(m){ hours[m] = 0; });
    try{
      var prevSnap = await S.db.doc('effortBudgets/'+effortDocId(year-1, modelId)).get();
      if(prevSnap.exists && prevSnap.data().hours){
        effortsList.forEach(function(m){ hours[m] = prevSnap.data().hours[m] || 0; });
      }
    }catch(e){}
    await ref.set({ year: year, modelId: modelId, modelName: modelName, hours: hours, updatedAt: Date.now() });
  }

  /* ---------------- PAU DE SEBO (ranking de horas por tripulante) ---------------- */
  function slotToFuncaoMap_(cfg, modelKey){
    var map = { ni:'PLT', p1:'PLT', p2:'PLT' };
    var oeFuncao = modelKey==='H-60L' ? 'OE-5' : 'OE-3';
    for(var i=1;i<=cfg.mcCount;i++) map['mc'+i] = 'MC';
    for(var j=1;j<=cfg.oeCount;j++) map['oe'+j] = oeFuncao;
    var obsFuncao = cfg.observerPrefix==='sr' ? 'HSAR' : 'OS';
    for(var k=1;k<=cfg.observerCount;k++) map[cfg.observerPrefix+k] = obsFuncao;
    return map;
  }
  function renderPauDeSebo(main){
    if(!S.data.models.length){
      main.innerHTML = viewHead('Pau de Sebo', 'Pau de Sebo', 'Ranking de horas voadas por tripulante.')
        + '<p class="empty-note">Cadastre um modelo de aeronave em Administrador → Aeronaves primeiro.</p>';
      return;
    }
    if(!S.pauSeboModelId || !byId(S.data.models, S.pauSeboModelId)) S.pauSeboModelId = S.data.models[0].id;
    var model = byId(S.data.models, S.pauSeboModelId);
    var cfg = flightFormConfig(model.name);
    var slotMap = slotToFuncaoMap_(cfg, modelKeyFromName_(model.name));
    S.pauSeboMode = S.pauSeboMode || 'ano';
    S.pauSeboYear = S.pauSeboYear || new Date().getFullYear();

    var modelTabs = S.data.models.map(function(m){
      return '<button class="tab'+(m.id===S.pauSeboModelId?' active':'')+'" data-psmodel="'+m.id+'">'+esc(m.name)+'</button>';
    }).join('');

    var flights = S.data.flights.filter(function(f){
      var matchesModel = flightMatchesModel_(f, model.id, model.name);
      if(!matchesModel) return false;
      if(S.pauSeboMode==='30dias') return (f.date||'') >= last30CutoffISO_();
      return (f.date||'').slice(0,4) === String(S.pauSeboYear);
    });
    var allModelFlights = S.data.flights.filter(function(f){
      return flightMatchesModel_(f, model.id, model.name);
    });
    function daysSinceISO_(iso){
      if(!iso) return null;
      var d = new Date(iso+'T00:00:00');
      if(isNaN(d.getTime())) return null;
      return Math.floor((Date.now() - d.getTime()) / 86400000);
    }

    // monta o elenco a partir dos PERFIS CADASTRADOS com aquela função e qualificados nesse modelo
    // {PLT: {TRI: {min, lastDate}}, MC: {...}, ...}
    var byFuncao = {};
    Object.keys(slotMap).forEach(function(slot){ byFuncao[slotMap[slot]] = byFuncao[slotMap[slot]] || {}; });
    Object.keys(byFuncao).forEach(function(funcao){
      S.data.profiles.forEach(function(p){
        if(!p.trigrama) return;
        if(profileHasFuncaoOnModel_(p, funcao, model.id)){
          byFuncao[funcao][p.trigrama.toUpperCase()] = { min: 0, lastDate: null };
        }
      });
    });

    // soma horas do período filtrado (só de quem está no elenco daquela função)
    flights.forEach(function(f){
      Object.keys(slotMap).forEach(function(slot){
        if(isEmptyTri_(f[slot])) return;
        var tri = String(f[slot]).trim().toUpperCase();
        var funcao = slotMap[slot];
        if(!byFuncao[funcao][tri]) return; // não cadastrado com essa função nesse modelo
        byFuncao[funcao][tri].min += (f.durationMin||0);
      });
    });

    // último voo NAQUELA função específica, olhando o histórico todo (não só o período filtrado)
    allModelFlights.forEach(function(f){
      var d = String(f.date||'').trim();
      if(!d) return;
      Object.keys(slotMap).forEach(function(slot){
        if(isEmptyTri_(f[slot])) return;
        var tri = String(f[slot]).trim().toUpperCase();
        var funcao = slotMap[slot];
        if(!byFuncao[funcao][tri]) return;
        if(!byFuncao[funcao][tri].lastDate || d > byFuncao[funcao][tri].lastDate) byFuncao[funcao][tri].lastDate = d;
      });
    });

    function triLabel(tri){
      var p = S.data.profiles.find(function(x){ return (x.trigrama||'').toUpperCase()===tri; });
      return p ? (p.posto?p.posto+' ':'') + (p.nomeGuerra||p.name) : tri;
    }

    var FUNCAO_ORDER = ['PLT','MC','OE-3','OE-5','OS','HSAR'];
    var sections = FUNCAO_ORDER.filter(function(f){ return byFuncao[f]; }).map(function(funcao){
      var entries = Object.keys(byFuncao[funcao]).map(function(tri){
        return { tri:tri, min:byFuncao[funcao][tri].min, lastDate:byFuncao[funcao][tri].lastDate };
      }).sort(function(a,b){ return b.min - a.min; });
      var rows = entries.map(function(e, idx){
        var isTop = idx===0 && e.min>0;
        var days = daysSinceISO_(e.lastDate);
        var daysColor = days==null ? 'var(--text-dim)' : (days>60 ? 'var(--danger)' : (days>30 ? 'var(--amber)' : 'var(--teal)'));
        return '<div class="strip"'+(isTop?' style="border-left-color:var(--amber);"':'')+'>'
          + '<div class="sc sc-lg mono" style="min-width:28px; color:'+(isTop?'var(--amber)':'var(--text-muted)')+';">'+(idx+1)+'º</div>'
          + '<div class="sc mono" style="color:var(--amber); min-width:48px;">'+esc(e.tri)+'</div>'
          + '<div class="sc" style="flex:1;">'+esc(triLabel(e.tri))+'</div>'
          + '<div class="sc sc-lg mono">'+fmtDuration(e.min)+'</div>'
          + '<div class="sc"><span class="sc-label">Último voo</span>'+(e.lastDate?fmtDate(e.lastDate):'—')+'</div>'
          + '<div class="sc"><span class="sc-label">Há</span><span class="mono" style="color:'+daysColor+';">'+(days!=null?days+' dia'+(days===1?'':'s'):'—')+'</span></div>'
          + '</div>';
      }).join('');
      return '<details class="panel" open style="padding:0;"><summary style="cursor:pointer; padding:16px 18px; list-style:none; display:flex; align-items:center; justify-content:space-between;">'
        + '<h3 style="margin:0;">'+funcao+' <span class="mono" style="color:var(--text-dim); font-weight:400; font-size:12px;">('+entries.length+')</span></h3>'
        + '<span class="toggle-chevron mono" style="color:var(--text-dim); font-size:13px;">▾</span>'
        + '</summary>'
        + '<div style="padding:0 18px 16px;">'
        + (rows || '<p class="empty-note">Nenhum voo registrado para esta função ainda.</p>')
        + '</div></details>';
    }).join('');

    main.innerHTML = viewHead('Pau de Sebo', 'Pau de Sebo — '+model.name, 'Ranking de horas voadas por tripulante, separado por função.')
      + '<div class="tabs" style="margin-bottom:14px;">'+modelTabs+'</div>'
      + '<div class="segmented" style="margin-bottom:12px;">'
      + '<button data-psmode="ano" class="'+(S.pauSeboMode==='ano'?'active':'')+'">Anual</button>'
      + '<button data-psmode="30dias" class="'+(S.pauSeboMode==='30dias'?'active':'')+'">Últimos 30 dias</button>'
      + '</div>'
      + (S.pauSeboMode==='ano'
        ? '<div style="display:flex; align-items:center; gap:12px; margin-bottom:18px;">'
          + '<button class="btn btn-sm" id="pausebo-year-prev">← '+(S.pauSeboYear-1)+'</button>'
          + '<div class="mono" style="font-family:var(--font-head); font-size:18px; color:var(--amber); font-weight:700;">'+S.pauSeboYear+'</div>'
          + '<button class="btn btn-sm" id="pausebo-year-next">'+(S.pauSeboYear+1)+' →</button>'
          + '</div>'
        : '')
      + sections;

    main.querySelectorAll('[data-psmodel]').forEach(function(b){
      b.addEventListener('click', function(){ S.pauSeboModelId = b.getAttribute('data-psmodel'); render(); });
    });
    main.querySelectorAll('[data-psmode]').forEach(function(b){
      b.addEventListener('click', function(){ S.pauSeboMode = b.getAttribute('data-psmode'); render(); });
    });
    var psPrev = document.getElementById('pausebo-year-prev'), psNext = document.getElementById('pausebo-year-next');
    if(psPrev) psPrev.addEventListener('click', function(){ S.pauSeboYear -= 1; render(); });
    if(psNext) psNext.addEventListener('click', function(){ S.pauSeboYear += 1; render(); });
  }

  function profileIndisponivelNaData_(profile, dateIso){
    if(!profile || !dateIso) return false;

      if(!u.start) return false;
      var matches = (u.profileId===profile.id) || (tri && String(u.trig||'').trim().toUpperCase()===tri);
      return matches && dateIso>=u.start && dateIso<=(u.end||u.start);
    });

      var indisp = profileIndisponivelNaData_(p, dateIso);
      var style = indisp ? ' style="color:#e5484d; font-weight:600;"' : '';
      var sel = selectedId===p.id ? ' selected' : '';
      return '<option value="'+p.id+'"'+sel+style+'>'+esc(p.trigrama||'—')+(indisp?' (indisponível)':'')+'</option>';

        }).join('')

  function generateEscalaPdf(data, alertaRows){
    if(typeof window.jspdf === 'undefined'){ toast('Gerador de PDF indisponível no momento.'); return; }
    var doc = new window.jspdf.jsPDF({unit:'pt', format:'a4', orientation:'landscape'});
    var W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
    var y = 48;
    try{
      doc.addImage(ESCUDO_B64, 'PNG', 36, 24, 32, 42);
      doc.addImage(BOLACHA_B64, 'PNG', W-36-38, 24, 38, 38);
    }catch(e){}
    doc.setFont('helvetica','bold'); doc.setFontSize(16);
    doc.text('Escala de Voo C/'+data.modelName, W/2, y, {align:'center'});
    doc.setFontSize(11);
    doc.text('DATA: '+fmtDate(data.date), W/2, y+16, {align:'center'});
    y += 44;
    doc.setDrawColor(180); doc.line(36, y, W-36, y); y += 20;

    var colW = (W-72)/2;
    function alertaTable(title, values, x0){
      var yy = y;
      doc.setFont('helvetica','bold'); doc.setFontSize(10);
      doc.text(title, x0+colW/2, yy, {align:'center'}); yy += 16;
      doc.setFontSize(9);
      alertaRows.forEach(function(r){
        var display;
        if(r.freeText){
          display = (values && values[r.key]) || '—';
        } else {
          var ids = (values && values[r.key]) || [];
          display = ids.map(function(pid){ var p=byId(S.data.profiles,pid); return p?(p.trigrama||'—'):'—'; }).join(' / ') || '—';
        }
        doc.setFont('helvetica','bold'); doc.text(r.label, x0+4, yy);
        doc.setFont('helvetica','normal'); doc.text(String(display), x0+90, yy);
        yy += 15;
      });
      return yy;
    }
    var yEntra = alertaTable('ALERTA QUE ENTRA', data.alertaEntra, 36);
    var ySai = alertaTable('ALERTA QUE SAI', data.alertaSai, 36+colW+0);
    y = Math.max(yEntra, ySai) + 6;
    doc.setFont('helvetica','bold'); doc.setFontSize(9.5);
    doc.text('ANV DE ALERTA: '+(data.anvAlerta||'—'), W/2, y, {align:'center'});
    y += 22;
    doc.setDrawColor(180); doc.line(36, y, W-36, y); y += 18;

    var tblLeft = 36, tblRight = W-36, tblW = tblRight-tblLeft;
    var wFrac = { dep:0.055, codChamada:0.08, anv:0.06, pilotos:0.13, mecanicos:0.13, oe:0.1, os:0.12, codigoOi:0.07, tempo:0.06, area:0.09, obs:0.105 };
    var colX = {}, cx = tblLeft;
    ESCALA_TABLE_COLS.forEach(function(c){ colX[c.key] = cx; cx += wFrac[c.key]*tblW; });
    doc.setFont('helvetica','bold'); doc.setFontSize(8);
    ESCALA_TABLE_COLS.forEach(function(c){ doc.text(c.label, colX[c.key]+2, y); });
    doc.setDrawColor(120); doc.setLineWidth(0.8); doc.line(36, y+4, W-36, y+4); doc.setLineWidth(0.5);
    y += 20;
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
    var tableCrewCfgPdf = ESCALA_TABLE_CREW[modelKeyFromName_(data.modelName)] || ESCALA_TABLE_CREW['SC-105'];
    (data.rows||[]).forEach(function(row){
      if(y > H-100){ doc.addPage('a4','landscape'); y = 48; }
      ESCALA_TABLE_COLS.forEach(function(c){
        var val;
        if(tableCrewCfgPdf[c.key]){
          val = (row[c.key]||[]).map(function(pid){ var p=byId(S.data.profiles,pid); return p?(p.trigrama||'—'):'—'; }).join('/');
        } else {
          val = row[c.key]||'';
        }
        var lines = doc.splitTextToSize(val, (wFrac[c.key]*tblW)-6);
        doc.text(lines[0]||'', colX[c.key]+2, y);
      });
      doc.setDrawColor(220); doc.line(36, y+5, W-36, y+5);
      y += 18;
    });

    y += 16;
    doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.text('OBSERVAÇÕES:', 36, y); y += 14;
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
    var obsLines = doc.splitTextToSize(data.observacoes||'—', W-72);
    obsLines.forEach(function(l){ if(y>H-60){doc.addPage('a4','landscape'); y=48;} doc.text(l, 36, y); y+=13; });

    y = H - 70;
    doc.setDrawColor(150); doc.line(W/2-90, y, W/2+90, y); y += 14;
    doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.text(data.responsavelNome||'—', W/2, y, {align:'center'}); y += 13;
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.text(data.responsavelCargo||'—', W/2, y, {align:'center'});

    var blob = doc.output('blob');
    var filename = 'Escala-'+data.modelName.replace(/[^a-zA-Z0-9-]/g,'')+'-'+data.date+'.pdf';
    var url = URL.createObjectURL(blob); window.open(url, '_blank');
  }

  function renderEsforco(main){
    main.innerHTML = viewHead('Esforço aéreo', 'Esforço aéreo', 'Aloque as horas anuais por esforço e acompanhe o realizado.')
      + '<div class="tabs">'
      + '<button class="tab'+(S.esforcoTab==='alocacao'?' active':'')+'" data-etab="alocacao">Alocação anual</button>'
      + '<button class="tab'+(S.esforcoTab==='resumo'?' active':'')+'" data-etab="resumo">Resumo de voos</button>'
      + '</div>'
      + '<div id="esforco-body"></div>';

      b.addEventListener('click', function(){ S.esforcoTab = b.getAttribute('data-etab'); renderEsforco(main); });

    if(S.esforcoTab==='alocacao') renderEsforcoAlocacao(body); else renderEsforcoResumo(body);

  function renderEsforcoAlocacao(body){
    if(!S.data.models.length){ body.innerHTML = '<p class="empty-note">Cadastre um modelo de aeronave em Administrador → Aeronaves primeiro.</p>'; return; }
    if(!S.effortModelId || !byId(S.data.models, S.effortModelId)) S.effortModelId = S.data.models[0].id;
    var model = byId(S.data.models, S.effortModelId);
    var year = S.effortYear;

    var modelTabs = S.data.models.map(function(m){
      return '<button class="tab'+(m.id===S.effortModelId?' active':'')+'" data-emodel="'+m.id+'">'+esc(m.name)+'</button>';
    }).join('');

    var yearsForModel = S.data.effortBudgets.filter(function(d){ return d.modelId===model.id; })
      .map(function(d){ return d.year; }).sort(function(a,b){ return b-a; });
    var yearChips = yearsForModel.map(function(y){
      return '<button class="btn btn-sm'+(y===year?' btn-amber':'')+'" data-eyear="'+y+'" style="margin-right:6px; margin-bottom:6px;">'+y+'</button>';
    }).join('');

    var docId = effortDocId(year, model.id);
    var doc = byId(S.data.effortBudgets, docId);

    var header = '<div class="tabs" style="margin-bottom:14px;">'+modelTabs+'</div>'
      + '<div style="display:flex; align-items:center; gap:12px; margin-bottom:6px; flex-wrap:wrap;">'
      + '<button class="btn btn-sm" id="year-prev">← '+(year-1)+'</button>'
      + '<div class="mono" style="font-family:var(--font-head); font-size:20px; color:var(--amber); font-weight:700;">'+year+'</div>'
      + '<button class="btn btn-sm" id="year-next">'+(year+1)+' →</button>'
      + '</div>'
      + (yearChips ? '<div style="margin-bottom:16px;">'+yearChips+'</div>' : '');

    if(!doc){
      body.innerHTML = header + '<p class="empty-note">Preparando alocação de '+year+' para '+esc(model.name)+' (copiando do ano anterior, se houver)…</p>';
      var pendKey = docId;
      if(!S.effortPending[pendKey]){
        S.effortPending[pendKey] = true;
        ensureEffortDoc(year, model.id, model.name).catch(function(){ toast('Erro ao preparar alocação.'); }).finally(function(){ delete S.effortPending[pendKey]; });
      }
      wireEffortNav(body, model);
      return;
    }

    var modelEfforts = effortsForModel(model.id, model.name);
    var totalAlloc = modelEfforts.reduce(function(s,m){ return s + (Number(doc.hours[m]) || 0); }, 0);

    var flightsForYearModel = S.data.flights.filter(function(f){
      var matchesModel = flightMatchesModel_(f, model.id, model.name);
      return matchesModel && String(f.date||'').trim().slice(0,4) === String(year);
    });
    var flownByEsforco = {};
    modelEfforts.forEach(function(m){ flownByEsforco[m] = 0; });
    flightsForYearModel.forEach(function(f){
      if(f.missionType && flownByEsforco.hasOwnProperty(f.missionType)) flownByEsforco[f.missionType] += (f.durationMin||0);
    });
    var totalFlownMin = modelEfforts.reduce(function(s,m){ return s + flownByEsforco[m]; }, 0);

    var rows = modelEfforts.map(function(m){
      var alloc = Number(doc.hours[m]) || 0;
      var flownH = flownByEsforco[m]/60;
      var saldo = alloc - flownH;
      return '<div class="strip"><div class="sc sc-lg" style="min-width:200px;">'+esc(m)+'</div>'
        + '<div class="field" style="margin:0; flex:0 0 120px;"><input type="text" class="mono" data-hours="'+esc(m)+'" value="'+fmtHoursDecimal(alloc)+'" placeholder="Ex.: 40h30" style="width:100%;"></div>'
        + '<div class="sc"><span class="sc-label">Voado</span>'+fmtDuration(flownByEsforco[m])+'</div>'
        + '<div class="sc"><span class="sc-label">Saldo</span><span style="color:'+(saldo<0?'var(--danger)':'var(--teal)')+';">'+fmtHoursDecimal(saldo)+'</span></div>'
        + '</div>';
    }).join('');

    body.innerHTML = header
      + '<div class="kpi-row">'
      + '<div class="kpi"><div class="v">'+fmtHoursDecimal(totalAlloc)+'</div><div class="l">Alocado no ano</div></div>'
      + '<div class="kpi"><div class="v">'+fmtDuration(totalFlownMin)+'</div><div class="l">Voado no ano</div></div>'
      + '<div class="kpi"><div class="v" style="color:'+((totalAlloc-totalFlownMin/60)<0?'var(--danger)':'var(--teal)')+';">'+fmtHoursDecimal(totalAlloc-totalFlownMin/60)+'</div><div class="l">Saldo</div></div>'
      + '</div>'
      + '<div class="panel"><h3>Alocação por esforço — '+esc(model.name)+' · '+year+'</h3>'
      + '<form id="form-effort">' + rows
      + '<div class="field" style="margin-top:14px;"><label>Motivo da alteração</label><input name="reason" placeholder="Ex.: revisão de PAOP, redistribuição entre esforços..."></div>'
      + '<button class="btn btn-amber" type="submit" style="margin-top:6px;">Salvar alocação</button></form>'
      + '</div>'
      + '<div class="panel"><h3>Histórico de alterações</h3><div id="effort-history"></div></div>';

    renderEffortHistory(document.getElementById('effort-history'), doc.history||[]);

    wireEffortNav(body, model);
    document.getElementById('form-effort').addEventListener('submit', function(e){
      e.preventDefault();
      var hours = {};
      var changes = [];
      modelEfforts.forEach(function(m){
        var input = e.target.querySelector('[data-hours="'+m+'"]');
        var val = parseHoursInput_(input.value);
        hours[m] = val;
        var before = Number(doc.hours[m]) || 0;
        if(val !== before) changes.push({ esforco: m, before: before, after: val });
      });
      if(!changes.length){ toast('Nenhuma alteração detectada.'); return; }
      var reason = (new FormData(e.target).get('reason')||'').trim();
      if(!reason){ toast('Informe o motivo da alteração.'); return; }
      var history = (doc.history||[]).concat([{ ts: Date.now(), profileId: S.profileId, reason: reason, changes: changes }]);
      S.db.doc('effortBudgets/'+docId).set({ year: year, modelId: model.id, modelName: model.name, hours: hours, history: history, updatedAt: Date.now() })
        .then(function(){ toast('Alocação salva.'); })
        .catch(function(){ toast('Erro ao salvar alocação.'); });
    });
  }

  function renderEffortHistory(el, history){
    if(!history.length){ el.innerHTML = '<p class="empty-note">Nenhuma alteração registrada ainda.</p>'; return; }
    var sorted = history.slice().sort(function(a,b){ return b.ts - a.ts; });
    el.innerHTML = sorted.map(function(h){
      var when = new Date(h.ts);
      var whenStr = fmtDate(when.toISOString().slice(0,10)) + ' ' + when.toTimeString().slice(0,5);
      var deltas = (h.changes||[]).map(function(c){
        return '<span class="mono" style="display:inline-block; margin-right:10px;">'+esc(c.esforco)+': '+fmtHoursDecimal(c.before)+' → '+fmtHoursDecimal(c.after)+'</span>';
      }).join('');
      return '<div class="strip pending" style="flex-direction:column; align-items:flex-start; gap:6px;">'
        + '<div style="display:flex; gap:12px; align-items:baseline; flex-wrap:wrap;"><span class="sc mono" style="color:var(--amber);">'+esc(whenStr)+'</span><span class="sc">'+esc(profileLabel(h.profileId))+'</span></div>'
        + '<div style="font-size:13.5px;">'+esc(h.reason)+'</div>'
        + '<div>'+deltas+'</div>'
        + '</div>';
    }).join('');
  }

  function wireEffortNav(body, model){
    body.querySelectorAll('[data-emodel]').forEach(function(b){
      b.addEventListener('click', function(){ S.effortModelId = b.getAttribute('data-emodel'); render(); });
    });
    body.querySelectorAll('[data-eyear]').forEach(function(b){
      b.addEventListener('click', function(){ S.effortYear = Number(b.getAttribute('data-eyear')); render(); });
    });
    var prevBtn = document.getElementById('year-prev'), nextBtn = document.getElementById('year-next');
    if(prevBtn) prevBtn.addEventListener('click', function(){ S.effortYear -= 1; render(); });

  var ALL_CREW_SLOT_KEYS = ['ni','p1','p2','mc1','mc2','mc3','mc4','mc5','mc6','oe1','oe2','oe3','oe4',
    'os1','os2','os3','os4','os5','os6','os7','os8','os9','os10','os11','os12',
    'sr1','sr2','sr3','sr4','sr5','sr6','sr7','sr8'];
  function flightCrewTrigramas_(f){
    var set = {};
    ALL_CREW_SLOT_KEYS.forEach(function(k){ if(!isEmptyTri_(f[k])) set[String(f[k]).trim().toUpperCase()]=true; });
    if(!Object.keys(set).length && f.crew && f.crew.length){
      f.crew.forEach(function(pid){ var p=byId(S.data.profiles,pid); if(p&&p.trigrama) set[p.trigrama.toUpperCase()]=true; });
    }
    return Object.keys(set);
  }
  function isEmptyTri_(v){
    var t = String(v||'').trim();
    return !t || t==='-' || t==='—' || t==='–' || t.toUpperCase()==='N/A' || t.toUpperCase()==='NA';
  }
  function triDisplayLabel_(tri){
    var p = S.data.profiles.find(function(x){ return (x.trigrama||'').toUpperCase()===tri; });
    return p ? (p.trigrama+' · '+(p.nomeGuerra||p.name)) : tri;
  }
  function last30CutoffISO_(){
    return new Date(Date.now() - 30*86400000).toISOString().slice(0,10);
  }

  function renderEsforcoResumo(body){
    S.resumoMode = S.resumoMode || 'ano';
    S.resumoYear = S.resumoYear || new Date().getFullYear();

    var flights = S.data.flights.filter(function(f){
      if(S.resumoMode==='30dias') return (f.date||'') >= last30CutoffISO_();
      return (f.date||'').slice(0,4) === String(S.resumoYear);
    });

    var totalMin = flights.reduce(function(s,f){return s+(f.durationMin||0);}, 0);

    var byAircraft = {};
    flights.forEach(function(f){
      byAircraft[f.registration] = byAircraft[f.registration] || {reg:f.registration, model:f.modelName, count:0, min:0};
      byAircraft[f.registration].count++; byAircraft[f.registration].min += (f.durationMin||0);
    });
    var byCrew = {};
    flights.forEach(function(f){
      flightCrewTrigramas_(f).forEach(function(tri){
        byCrew[tri] = byCrew[tri] || {name:triDisplayLabel_(tri), count:0, min:0};
        byCrew[tri].count++; byCrew[tri].min += (f.durationMin||0);
      });
    });

    var aircraftRows = Object.values(byAircraft).sort(function(a,b){return b.min-a.min;}).map(function(r){
      return '<tr><td class="mono">'+esc(r.reg)+'</td><td class="mono">'+esc(r.model)+'</td><td class="mono">'+r.count+'</td><td class="mono">'+fmtDuration(r.min)+'</td></tr>';
    }).join('');
    var crewRows = Object.values(byCrew).sort(function(a,b){return b.min-a.min;}).map(function(r){
      return '<tr><td class="mono">'+esc(r.name)+'</td><td class="mono">'+r.count+'</td><td class="mono">'+fmtDuration(r.min)+'</td></tr>';
    }).join('');

    var modeSwitch = '<div class="segmented" style="margin-bottom:12px;">'
      + '<button data-rmode="ano" class="'+(S.resumoMode==='ano'?'active':'')+'">Anual</button>'
      + '<button data-rmode="30dias" class="'+(S.resumoMode==='30dias'?'active':'')+'">Últimos 30 dias</button>'
      + '</div>';
    var yearNav = S.resumoMode==='ano'
      ? '<div style="display:flex; align-items:center; gap:12px; margin-bottom:18px;">'
        + '<button class="btn btn-sm" id="resumo-year-prev">← '+(S.resumoYear-1)+'</button>'
        + '<div class="mono" style="font-family:var(--font-head); font-size:18px; color:var(--amber); font-weight:700;">'+S.resumoYear+'</div>'
        + '<button class="btn btn-sm" id="resumo-year-next">'+(S.resumoYear+1)+' →</button>'
        + '</div>'
      : '';

    body.innerHTML = modeSwitch + yearNav
      + '<div class="kpi-row">'
      + '<div class="kpi"><div class="v">'+fmtDuration(totalMin)+'</div><div class="l">Horas voadas</div></div>'
      + '<div class="kpi"><div class="v">'+flights.length+'</div><div class="l">Voos registrados</div></div>'
      + '<div class="kpi"><div class="v">'+Object.keys(byAircraft).length+'</div><div class="l">Aeronaves ativas</div></div>'
      + '</div>'
      + '<div class="grid2">'
      + '<div class="panel"><h3>Por aeronave</h3>'+(aircraftRows?'<table class="data"><thead><tr><th>Matrícula</th><th>Modelo</th><th>Voos</th><th>Horas</th></tr></thead><tbody>'+aircraftRows+'</tbody></table>':'<p class="empty-note">Sem voos no período.</p>')+'</div>'
      + '<div class="panel"><h3>Por tripulante</h3>'+(crewRows?'<table class="data"><thead><tr><th>Nome</th><th>Voos</th><th>Horas</th></tr></thead><tbody>'+crewRows+'</tbody></table>':'<p class="empty-note">Sem voos no período.</p>')+'</div>'
      + '</div>';

    body.querySelectorAll('[data-rmode]').forEach(function(b){
      b.addEventListener('click', function(){ S.resumoMode = b.getAttribute('data-rmode'); render(); });
    });
    var prevBtn = document.getElementById('resumo-year-prev'), nextBtn = document.getElementById('resumo-year-next');
    if(prevBtn) prevBtn.addEventListener('click', function(){ S.resumoYear -= 1; render(); });
    if(nextBtn) nextBtn.addEventListener('click', function(){ S.resumoYear += 1; render(); });
  }

  /* ---------------- INDISPONIBILIDADE ---------------- */
  function renderIndisp(main){
    S.indispFuncaoFilter = S.indispFuncaoFilter || '';
    var profOptsFor = function(funcao){
      return S.data.profiles.filter(function(p){ return !funcao || profileHasFuncaoAny_(p, funcao); })
        .map(function(p){return '<option value="'+p.id+'">'+esc(p.trigrama||'')+' — '+esc(p.nomeGuerra||p.name)+'</option>';}).join('');
    };
    var funcaoOpts = '<option value="">Todas</option>' + FUNCOES_ALL.map(function(f){return '<option value="'+f+'"'+(f===S.indispFuncaoFilter?' selected':'')+'>'+f+'</option>';}).join('');
    var profOpts = profOptsFor(S.indispFuncaoFilter);
    var PERIODOS = ['TODO O DIA','MANHÃ','TARDE','NOITE'];
    main.innerHTML = viewHead('Indisponibilidade', 'Lançar indisponibilidade', 'Registre os dias em que um tripulante não estará disponível para voo.')
      + '<div class="panel"><form id="form-unavail">'
      + '<div class="grid2">'
      + '<div class="field"><label>Filtrar por função</label><select id="funcao-filter">'+funcaoOpts+'</select></div>'
      + '<div class="field"><label>Tripulante</label><select name="profileId" id="profile-select" required>'+(profOpts||'<option value="">Nenhum perfil com essa função</option>')+'</select></div>'
      + '</div><div class="grid3">'
      + '<div class="field"><label>Motivo</label><select name="reason">'+MOTIVOS.map(function(m){return '<option>'+m+'</option>';}).join('')+'</select></div>'
      + '<div class="field"><label>Período</label><select name="periodo">'+PERIODOS.map(function(p){return '<option>'+p+'</option>';}).join('')+'</select></div>'
      + '<div class="field"><label>Tipo (QT)</label><input name="qt" placeholder="Ex.: OBSERVADOR"></div>'
      + '</div><div class="grid2">'
      + '<div class="field"><label>Data início</label><input type="date" name="start" required></div>'
      + '<div class="field"><label>Data fim</label><input type="date" name="end"></div>'
      + '</div>'
      + '<div class="field"><label>Observações</label><input name="notes" placeholder="Opcional"></div>'
      + '<button class="btn btn-amber" type="submit" '+(S.data.profiles.length?'':'disabled')+'>Lançar indisponibilidade</button>'
      + '</form></div>'
      + '<div class="panel"><h3>Indisponibilidades registradas</h3><div id="unavail-list"></div></div>';

    document.getElementById('funcao-filter').addEventListener('change', function(e){
      S.indispFuncaoFilter = e.target.value;
      document.getElementById('profile-select').innerHTML = profOptsFor(S.indispFuncaoFilter) || '<option value="">Nenhum perfil com essa função</option>';
    });

    function profileByTri(tri){
      return S.data.profiles.find(function(p){ return (p.trigrama||'').toUpperCase() === (tri||'').toUpperCase(); });
    }
    function unavailDisplayName(u){
      if(u.profileId) return profileLabel(u.profileId);
      var p = u.trig ? profileByTri(u.trig) : null;
      return p ? profileLabel(p.id) : (u.trig || '—');
    }

    var list = S.data.unavail.slice().sort(function(a,b){ return (b.start||'').localeCompare(a.start||''); });
    var wrap = document.getElementById('unavail-list');
    if(!list.length){ wrap.innerHTML = '<p class="empty-note">Nenhum lançamento ainda.</p>'; }
    else wrap.innerHTML = list.map(function(u){
      return '<div class="strip off"><div class="sc sc-lg">'+esc(unavailDisplayName(u))+'</div>'
        + '<div class="sc"><span class="sc-label">Início</span>'+fmtDate(u.start)+'</div>'
        + '<div class="sc"><span class="sc-label">Fim</span>'+fmtDate(u.end||u.start)+'</div>'
        + '<div class="sc"><span class="sc-label">Motivo</span>'+esc(u.reason)+'</div>'
        + '<div class="sc"><span class="sc-label">Período</span>'+esc(u.periodo||'—')+'</div>'
        + '<div class="spacer"></div>'
        + '<div class="actions"><button class="btn btn-danger btn-sm" data-del-unavail="'+u.id+'">Remover</button></div>'
        + '</div>';
    }).join('');

      wireConfirmDelete(b, function(){ S.db.collection('unavailability').doc(b.getAttribute('data-del-unavail')).delete().then(function(){ toast('Indisponibilidade removida.'); }).catch(function(){ toast('Erro ao remover.'); }); });
    });

    document.getElementById('form-unavail').addEventListener('submit', function(e){
      e.preventDefault();
      var fd = new FormData(e.target);
      S.db.collection('unavailability').add({
        profileId: fd.get('profileId'), trig: profileTri(fd.get('profileId')), qt: fd.get('qt')||'',
        start: fd.get('start'), end: fd.get('end')||fd.get('start'), periodo: fd.get('periodo'),
        reason: fd.get('reason'), notes: fd.get('notes')||'', loggedBy: S.profileId, createdAt: Date.now(), syncedToSheet: false
      }).then(function(){ toast('Indisponibilidade lançada.'); e.target.reset(); })
      .catch(function(){ toast('Erro ao salvar.'); });
    });
  }

  /* ---------------- ORDEM DE MISSÃO ---------------- */
  function nextOrderNumber(){
    var yy = String(new Date().getFullYear()).slice(-2);
    var existing = S.data.orders.filter(function(o){ return (o.number||'').indexOf(yy)===0; }).length;
    var n = existing + 1;
    return yy + String(n).padStart(4,'0');
  }

  function renderOrdem(main){
    if(S.reportOrderId){
      var repOrder = byId(S.data.orders, S.reportOrderId);
      if(!repOrder){ S.reportOrderId = null; }
      else { renderOrdemRelatorio(main, repOrder); return; }
    }
    var aircraftOpts = S.data.aircraft.map(function(a){ var m=byId(S.data.models,a.modelId); return '<option value="'+a.id+'" data-model="'+a.modelId+'">'+esc(a.registration)+' — '+esc(m?m.name:'')+'</option>'; }).join('');
    var firstAircraft = S.data.aircraft[0];
    var initialModelId = firstAircraft ? firstAircraft.modelId : null;

    function crewChipsFor(modelId){
      if(!modelId) return '<p class="empty-note">Selecione uma aeronave para ver a tripulação qualificada.</p>';
      var model = byId(S.data.models, modelId);
      var funcoesDoModelo = FUNCOES_POR_MODELO[modelKeyFromName_(model ? model.name : '')] || [];
      var html = funcoesDoModelo.map(function(f){
        var matches = S.data.profiles.filter(function(p){
          return profileHasFuncaoOnModel_(p, f, modelId);
        });
        if(!matches.length) return '';
        var rows = matches.map(function(p){
          return '<div class="strip" id="crewrow_'+p.id+'" style="padding:7px 10px; border-left-color:var(--danger);">'
            + '<span class="sc mono" style="color:var(--amber); min-width:42px;">'+esc(p.trigrama||'—')+'</span>'

        return '<details class="crew-details" style="margin-bottom:10px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface);">'
          + '<summary style="cursor:pointer; padding:9px 12px; font-family:var(--font-head); font-size:12.5px; color:var(--text-muted); list-style:none;">'+f+' <span class="mono" style="color:var(--text-dim); font-size:11px;">('+matches.length+')</span></summary>'
          + '<div style="padding:0 10px 10px;">'+rows+'</div>'
          + '</details>';
      }).join('');
      return html || '<p class="empty-note">Nenhum tripulante qualificado neste modelo.</p>';
