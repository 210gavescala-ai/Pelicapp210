    var icaoDatalist = '<datalist id="icao-list">' + AIRPORTS_BR.concat(S.data.customAirports).map(function(a){
      return '<option value="'+esc(a.icao)+'">'+esc(a.icao)+' — '+esc(a.name)+' ('+esc(a.city||'')+'/'+esc(a.uf||'')+')</option>';
    }).join('') + '</datalist>';

    function legRowHtml(n){
      return '<div class="strip" data-leg style="flex-wrap:wrap; align-items:flex-end; gap:10px;">'
        + '<div style="min-width:56px; font-family:var(--font-head); font-size:12px; color:var(--text-muted); padding-bottom:9px;">Perna '+n+'</div>'
        + '<div class="field" style="margin:0; flex:1; min-width:100px;"><label>Origem</label><input list="icao-list" class="mono leg-origin" style="text-transform:uppercase;" placeholder="SBCG"></div>'
        + '<div class="field" style="margin:0; flex:1; min-width:100px;"><label>Destino</label><input list="icao-list" class="mono leg-dest" style="text-transform:uppercase;" placeholder="SBBR"></div>'
        + '<div class="field" style="margin:0; flex:0 0 100px;"><label>ETD (UTC)</label><input type="text" class="mono leg-etd" placeholder="HH:MMZ"></div>'
        + '<div class="field" style="margin:0; flex:0 0 90px;"><label>Distância</label><div class="mono leg-dist" style="padding:9px 0; color:var(--teal);">—</div></div>'
        + '<div class="field" style="margin:0; flex:0 0 90px;"><label>Tempo voo</label><div class="mono leg-time" style="padding:9px 0; color:var(--teal);">—</div></div>'
        + '<button type="button" class="btn btn-danger btn-sm leg-remove">Remover</button>'
        + '</div>';
    }

    main.innerHTML = viewHead('Ordem de missão', 'Nova ordem de missão', 'Crie a ordem, consulte ordens anteriores e gere o PDF.')
      + icaoDatalist
      + '<div class="panel"><form id="form-order">'
      + '<div class="grid3">'
      + '<div class="field"><label>Número</label><input name="number" value="'+nextOrderNumber()+'" required></div>'
      + '<div class="field"><label>Data</label><input type="date" name="date" required value="'+new Date().toISOString().slice(0,10)+'"></div>'
      + '<div class="field"><label>Aeronave</label><select name="aircraftId" id="order-aircraft" required>'+(aircraftOpts||'<option value="">Cadastre aeronaves primeiro</option>')+'</select></div>'
      + '</div>'
      + '<div class="grid2">'
      + '<div class="field"><label>Tipo de missão</label><select name="missionType" required><option value="">—</option>'+TIPOS_OMIS.map(function(m){return '<option>'+m+'</option>';}).join('')+'</select></div>'
      + '<div class="field"><label>Esforço aéreo</label><select name="esforco" id="order-esforco" required><option value="">—</option>'+(initialModelId?effortsForModel(initialModelId, byId(S.data.models,initialModelId).name):MISSOES).map(function(m){return '<option>'+esc(m)+'</option>';}).join('')+'</select></div>'
      + '</div>'

      + '<div class="field"><label>Rota de voo <span style="color:var(--text-dim); font-weight:400;">(horários em UTC)</span></label>'
      + '<div id="legs-container">'+legRowHtml(1)+'</div>'
      + '<button type="button" class="btn btn-sm" id="add-leg" style="margin-top:6px;">+ Adicionar perna</button>'
      + '<details style="margin-top:10px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface);">'
      + '<summary style="cursor:pointer; padding:8px 12px; font-size:12px; color:var(--text-muted);">Aeródromo não encontrado? Cadastre aqui</summary>'
      + '<div style="padding:4px 12px 12px;"><div class="grid3">'
      + '<div class="field"><label>ICAO</label><input id="new-icao" class="mono" style="text-transform:uppercase;" maxlength="4" placeholder="SWXX"></div>'
      + '<div class="field"><label>Nome</label><input id="new-icao-name" placeholder="Aeródromo..."></div>'
      + '<div class="field"><label>Cidade/UF</label><input id="new-icao-city" placeholder="Cidade/UF"></div>'
      + '</div><div class="grid2">'
      + '<div class="field"><label>Latitude</label><input id="new-icao-lat" type="number" step="any" placeholder="-20.4687"></div>'
      + '<div class="field"><label>Longitude</label><input id="new-icao-lon" type="number" step="any" placeholder="-54.6725"></div>'
      + '</div><button type="button" class="btn btn-sm" id="save-icao">Cadastrar aeródromo</button></div>'
      + '</details>'
      + '</div>'

      + '<div class="field"><label>Tripulação escalada</label><div id="order-crew">'+crewChipsFor(initialModelId)+'</div></div>'
      + '<div class="grid2">'
      + '<div class="field"><label>Documento acionador</label><input name="docAcionador" placeholder="Ex.: Ofício nº 123/2026"></div>'
      + '<div class="field"><label>Indenizável?</label><select name="indenizavel"><option value="">—</option><option value="Sim">Sim</option><option value="Não">Não</option></select></div>'
      + '</div>'
      + '<div class="field"><label>Objetivo da missão</label><textarea name="objective" rows="2" required placeholder="Ex.: Patrulha aérea na área X"></textarea></div>'
      + '<div class="field"><label>Detalhes / instruções</label><textarea name="details" rows="3" placeholder="Procedimentos, restrições, observações"></textarea></div>'
      + '<button class="btn btn-amber" type="submit">Criar ordem de missão</button>'
      + '</form></div>'
      + '<div class="panel"><h3 style="display:flex; align-items:center; justify-content:space-between;">Ordens anteriores <input id="order-search" placeholder="buscar por número..." style="width:200px; font-size:12.5px; padding:6px 9px;"></h3><div id="order-list"></div></div>';

    function currentSpeed(){
      var sel = document.getElementById('order-aircraft');
      var opt = sel ? sel.options[sel.selectedIndex] : null;
      var modelId = opt ? opt.getAttribute('data-model') : null;
      var model = modelId ? byId(S.data.models, modelId) : null;
      return model ? aircraftSpeedKt(model.name) : null;
    }
    function recalcLeg(row){
      var origin = findAirport(row.querySelector('.leg-origin').value);
      var dest = findAirport(row.querySelector('.leg-dest').value);
      var speed = currentSpeed();
      var distEl = row.querySelector('.leg-dist'), timeEl = row.querySelector('.leg-time');
      if(origin && dest){
        var nm = haversineNm(origin.lat, origin.lon, dest.lat, dest.lon);
        distEl.textContent = Math.round(nm)+' nm';
        if(speed){ timeEl.textContent = fmtDuration(Math.round(nm/speed*60)); timeEl.style.color = 'var(--teal)'; }
        else { timeEl.textContent = '—'; }
        distEl.style.color = 'var(--teal)';
      } else {
        distEl.textContent = '—'; distEl.style.color = 'var(--text-dim)';
        timeEl.textContent = '—'; timeEl.style.color = 'var(--text-dim)';
      }
    }
    function recalcAllLegs(){
      document.querySelectorAll('#legs-container [data-leg]').forEach(recalcLeg);
    }
    function wireLegRow(row){
      row.querySelectorAll('.leg-origin,.leg-dest').forEach(function(inp){
        inp.addEventListener('change', function(){ recalcLeg(row); });
        inp.addEventListener('input', function(){ recalcLeg(row); });
      });
      row.querySelector('.leg-remove').addEventListener('click', function(){
        var container = document.getElementById('legs-container');
        if(container.querySelectorAll('[data-leg]').length > 1){ row.remove(); renumberLegs(); }
        else { row.querySelectorAll('input').forEach(function(i){ i.value=''; }); recalcLeg(row); }
      });
    }
    function renumberLegs(){
      document.querySelectorAll('#legs-container [data-leg]').forEach(function(row, idx){
        row.querySelector('div').textContent = 'Perna '+(idx+1);
      });
    }
    document.querySelectorAll('#legs-container [data-leg]').forEach(wireLegRow);
    document.getElementById('add-leg').addEventListener('click', function(){
      var container = document.getElementById('legs-container');
      var n = container.querySelectorAll('[data-leg]').length + 1;
      var wrap = document.createElement('div'); wrap.innerHTML = legRowHtml(n);
      var row = wrap.firstElementChild;
      container.appendChild(row);
      wireLegRow(row);
    });
    document.getElementById('save-icao').addEventListener('click', function(){
      var icao = document.getElementById('new-icao').value.trim().toUpperCase();
      var lat = Number(document.getElementById('new-icao-lat').value);
      var lon = Number(document.getElementById('new-icao-lon').value);
      if(!/^[A-Z0-9]{4}$/.test(icao)){ toast('Informe um código ICAO válido (4 caracteres).'); return; }
      if(!lat || !lon){ toast('Informe latitude e longitude.'); return; }
      S.db.doc('customAirports/'+icao).set({
        icao: icao, name: document.getElementById('new-icao-name').value.trim()||icao,
        city: document.getElementById('new-icao-city').value.trim(), uf: '', lat: lat, lon: lon, createdAt: Date.now()
      }).then(function(){ toast('Aeródromo cadastrado.'); recalcAllLegs(); })
      .catch(function(){ toast('Erro ao cadastrar aeródromo.'); });
    });

    function wireCrewRowColors(container){
      container.querySelectorAll('select[name^="crew_"]').forEach(function(sel){
        var row = document.getElementById('crewrow_'+sel.getAttribute('name').replace('crew_',''));
        var update = function(){ if(row) row.style.borderLeftColor = sel.value ? 'var(--teal)' : 'var(--danger)'; };
        update();
        sel.addEventListener('change', update);
      });
    }

    var aircraftSelect = document.getElementById('order-aircraft');
    if(aircraftSelect) aircraftSelect.addEventListener('change', function(e){
      var opt = e.target.options[e.target.selectedIndex];
      var modelId = opt ? opt.getAttribute('data-model') : null;
      var crewEl = document.getElementById('order-crew');
      crewEl.innerHTML = crewChipsFor(modelId);
      wireCrewRowColors(crewEl);
      recalcAllLegs();
      var esforcoSel = document.getElementById('order-esforco');
      var model = modelId ? byId(S.data.models, modelId) : null;
      var list = model ? effortsForModel(modelId, model.name) : MISSOES;
      esforcoSel.innerHTML = '<option value="">—</option>' + list.map(function(m){return '<option>'+esc(m)+'</option>';}).join('');
    });
    wireCrewRowColors(document.getElementById('order-crew'));

    renderOrderList(document.getElementById('order-list'), '');
    document.getElementById('order-search').addEventListener('input', function(e){
      renderOrderList(document.getElementById('order-list'), e.target.value.trim().toLowerCase());
    });

    document.getElementById('form-order').addEventListener('submit', function(e){
      e.preventDefault();
      var fd = new FormData(e.target);
      var crew = Array.from(e.target.querySelectorAll('select[name^="crew_"]')).filter(function(sel){ return sel.value; }).map(function(sel){
        return { profileId: sel.getAttribute('name').replace('crew_',''), custeio: sel.value };
      });
      var aircraft = byId(S.data.aircraft, fd.get('aircraftId'));
      var model = aircraft ? byId(S.data.models, aircraft.modelId) : null;
      var speed = model ? aircraftSpeedKt(model.name) : null;
      var route = Array.from(e.target.querySelectorAll('#legs-container [data-leg]')).map(function(row){
        var originIcao = row.querySelector('.leg-origin').value.trim().toUpperCase();
        var destIcao = row.querySelector('.leg-dest').value.trim().toUpperCase();
        var etd = row.querySelector('.leg-etd').value.trim();
        var origin = findAirport(originIcao), dest = findAirport(destIcao);
        var distanceNm = null, flightTimeMin = null;
        if(origin && dest){
          distanceNm = Math.round(haversineNm(origin.lat, origin.lon, dest.lat, dest.lon));
          if(speed) flightTimeMin = Math.round(distanceNm/speed*60);
        }
        return { origin: originIcao, destination: destIcao, etd: etd, distanceNm: distanceNm, flightTimeMin: flightTimeMin };
      }).filter(function(leg){ return leg.origin || leg.destination || leg.etd; });
      S.db.collection('missionOrders').add({
        number: fd.get('number'), date: fd.get('date'), aircraftId: fd.get('aircraftId'),
        registration: aircraft?aircraft.registration:'', modelName: model?model.name:'',
        missionType: fd.get('missionType'), esforco: fd.get('esforco'), crew: crew, route: route,
        docAcionador: fd.get('docAcionador')||'', indenizavel: fd.get('indenizavel')||'',
        objective: fd.get('objective'), details: fd.get('details')||'',
        createdBy: S.profileId, createdAt: Date.now()
      }).then(function(){ toast('Ordem de missão criada.'); e.target.reset(); render(); })
      .catch(function(){ toast('Erro ao criar ordem.'); });
    });
  }

  function renderOrdemRelatorio(main, order){
    var report = byId(S.data.orderReports, order.id) || {};
    var pernoites = report.pernoites || {};

    var flights = S.data.flights.filter(function(f){ return (f.omis||'').trim() === (order.number||'').trim(); })
      .sort(function(a,b){ return (a.date+(a.takeoff||'')).localeCompare(b.date+(b.takeoff||'')); });

    var flightRows = flights.map(function(f){
      var crewDisplay = (f.crew && f.crew.length) ? f.crew.map(function(pid){ var p=byId(S.data.profiles,pid); return p?(p.trigrama||'—'):'—'; }).join(', ')
        : ALL_CREW_SLOT_KEYS.map(function(k){ return f[k]; }).filter(function(v){ return !isEmptyTri_(v); }).join(', ');
      return '<div class="strip"><div class="sc sc-lg mono" style="color:var(--amber);">'+esc(f.registration)+'</div>'
        + '<div class="sc"><span class="sc-label">Data</span>'+fmtDate(f.date)+'</div>'
        + '<div class="sc"><span class="sc-label">DEP</span>'+esc(f.origin||'—')+' '+esc(f.takeoff||'—')+'</div>'
        + '<div class="sc"><span class="sc-label">ARR</span>'+esc(f.destination||'—')+' '+esc(f.landing||'—')+'</div>'
        + '<div class="sc"><span class="sc-label">EET</span>'+fmtDuration(f.durationMin)+'</div>'
        + '<div class="sc"><span class="sc-label">Combustível</span>'+esc(f.combustivel||'—')+'</div>'
        + '<div class="sc"><span class="sc-label">Lubrificante</span>'+esc(f.lubrificante||'—')+'</div>'
        + '<div class="spacer"></div>'
        + '<div class="sc" style="font-size:12px; color:var(--text-muted);">'+(crewDisplay||'—')+'</div>'
        + '</div>';
    }).join('');
    function sumNumeric_(list, key){
      return list.reduce(function(s,f){ var n = parseFloat(String(f[key]||'').replace(',','.')); return s + (isNaN(n)?0:n); }, 0);
    }
    var horasPorEsforco = {};
    flights.forEach(function(f){
      var key = f.missionType || '(sem esforço)';
      horasPorEsforco[key] = (horasPorEsforco[key]||0) + (f.durationMin||0);
    });
    var esforcoRowsHtml = Object.keys(horasPorEsforco).sort(function(a,b){ return horasPorEsforco[b]-horasPorEsforco[a]; }).map(function(k){
      return '<div class="strip" style="padding:6px 10px;"><div class="sc" style="flex:1;">'+esc(k)+'</div><div class="sc sc-lg mono" style="color:var(--teal);">'+fmtDuration(horasPorEsforco[k])+'</div></div>';
    }).join('');
    var totalPax = sumNumeric_(flights, 'pax');
    var totalComb = sumNumeric_(flights, 'combustivel');
    var totalLub = sumNumeric_(flights, 'lubrificante');
    var flightTotalsHtml = flights.length
      ? '<div class="kpi-row" style="margin-top:12px;">'
        + '<div class="kpi"><div class="v">'+totalPax+'</div><div class="l">PAX total</div></div>'
        + '<div class="kpi"><div class="v">'+totalComb+'</div><div class="l">Combustível total (somado)</div></div>'
        + '<div class="kpi"><div class="v">'+totalLub+'</div><div class="l">Lubrificante total (somado)</div></div>'
        + '</div>'
        + '<div style="margin-top:16px;"><div style="font-family:var(--font-head); font-size:12px; color:var(--text-muted); margin-bottom:6px;">Horas por esforço</div>'
        + esforcoRowsHtml + '</div>'
      : '';

    var crewList = order.crew || [];
    function pernoiteRowHtml(entry){
      entry = entry || {};
      return '<div class="strip" data-pernoite-row style="flex-wrap:wrap; align-items:flex-end;">'
        + '<div class="field" style="margin:0; flex:1; min-width:140px;"><label>Localidade</label><input class="pernoite-local" value="'+esc(entry.localidade||'')+'" placeholder="Ex.: SBFL"></div>'
        + '<div class="field" style="margin:0; flex:0 0 150px;"><label>De</label><input type="date" class="pernoite-from" value="'+esc(entry.from||'')+'"></div>'
        + '<div class="field" style="margin:0; flex:0 0 150px;"><label>Até</label><input type="date" class="pernoite-to" value="'+esc(entry.to||'')+'"></div>'
        + '<button type="button" class="btn btn-danger btn-sm pernoite-remove">Remover</button>'
        + '</div>';
    }
    var custeioTotalGeral = 0;
    var custeioTotalPorTipo = { 'Diária': 0, 'Comissionamento': 0, 'Gratificação de Representação': 0 };
    var diariaSimuladaTotal = 0;
    var custeioOverrides = report.custeioOverrides || {};
    var custeioTipoOverrides = report.custeioTipoOverrides || {};
    var combinedBlocks = crewList.map(function(c){
      var pid = typeof c === 'string' ? c : c.profileId;
      var profile = byId(S.data.profiles, pid);
      if(!profile) return '';
      var custeioOriginal = (typeof c === 'string') ? '' : (c.custeio || '');
      var custeioTipo = custeioTipoOverrides[pid] || custeioOriginal;
      var tipoSelectHtml = '<select class="custeio-tipo-override" data-pid="'+pid+'" style="max-width:240px;">'
        + CUSTEIOS.map(function(t){ return '<option'+(custeioTipo===t?' selected':'')+'>'+t+'</option>'; }).join('')
        + '</select>';

      var pernoiteEntries = pernoites[pid];
      if(!pernoiteEntries || !pernoiteEntries.length) pernoiteEntries = [{}];
      var pernoiteHtml = '<div class="pernoite-list" data-pid="'+pid+'">'+pernoiteEntries.map(pernoiteRowHtml).join('')+'</div>'
        + '<button type="button" class="btn btn-sm add-pernoite" data-pid="'+pid+'" style="margin-top:8px;">+ Adicionar pernoite</button>';

      var entriesValidas = (pernoites[pid]||[]).filter(function(e){ return e.localidade && e.from && e.to; });
      var override = custeioOverrides[pid] || '';
      var calculaDiaria = (custeioTipo==='Diária' || custeioTipo==='Comissionamento');
      var rows, totalStr, custeioTotalPessoa;
      if(calculaDiaria){
        var calc = calcularCusteio_(profile, entriesValidas, flights, override);
        custeioTotalPessoa = calc.total;
        totalStr = 'R$ '+calc.total.toFixed(2);
        rows = calc.detalhes.map(function(d){
          return '<div class="strip" style="padding:6px 10px;">'
            + '<div class="sc" style="flex:1;">'+esc(d.label)+'</div>'
            + '<div class="sc mono" style="color:var(--text-muted);">'+esc(d.qtd)+'</div>'
            + '<div class="sc mono">R$ '+d.valorUnit.toFixed(2)+'</div>'
            + '<div class="sc sc-lg mono" style="color:var(--teal);">R$ '+d.subtotal.toFixed(2)+'</div>'
            + '</div>';
        }).join('') || '<p class="empty-note">Sem pernoites lançados para calcular custeio.</p>';
      } else if(custeioTipo==='Gratificação de Representação'){
        var gr = calcularGratRep_(profile, flights);
        custeioTotalPessoa = gr.total;
        totalStr = 'R$ '+gr.total.toFixed(2);
        if(!gr.saida || !gr.retorno){
          rows = '<p class="empty-note">Sem voos com DEP/ARR vinculados a esta OMIS para calcular o tempo afastado.</p>';
        } else {
          var fmtDT = function(d){ return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); };
          rows = '<div class="strip" style="padding:6px 10px;">'
            + '<div class="sc" style="flex:1;">Saída '+fmtDT(gr.saida)+' → Retorno '+fmtDT(gr.retorno)+' ('+gr.elapsedH.toFixed(1)+'h afastado)</div>'
            + '<div class="sc mono" style="color:var(--text-muted);">'+gr.qtd+' grat.'+(gr.qtd===1?'':'s')+'</div>'
            + '<div class="sc mono">R$ '+gr.valorUnit.toFixed(2)+' (2% do soldo)</div>'
            + '<div class="sc sc-lg mono" style="color:var(--teal);">R$ '+gr.total.toFixed(2)+'</div>'
            + '</div>';
          if(!(S.data.soldos[0]||{})[profile.posto]) rows += '<p class="empty-note" style="margin-top:6px;">⚠️ Soldo de '+esc(profile.posto)+' não cadastrado em Administrador → Soldos — valor saindo zerado.</p>';
        }
      } else {
        custeioTotalPessoa = 0; totalStr = '—';
        rows = '<p class="empty-note">Selecione o tipo de custeio acima.</p>';
      }
      custeioTotalGeral += custeioTotalPessoa;
      if(custeioTotalPorTipo.hasOwnProperty(custeioTipo)) custeioTotalPorTipo[custeioTipo] += custeioTotalPessoa;
      // diária simulada: quanto seria se essa pessoa (como todo mundo) tivesse ido na Diária
      diariaSimuladaTotal += calcularCusteio_(profile, entriesValidas, flights, override).total;

      return '<div class="panel" style="margin-bottom:10px;"><h3 style="font-size:13.5px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;">'
        + '<span>'+esc(profileFull(pid))+' <span class="mono" style="color:var(--text-dim); font-weight:400; font-size:11.5px;">('+esc(profile.posto)+')</span></span>'
        + '<span class="mono" style="color:var(--amber);">'+totalStr+'</span></h3>'
        + '<div class="field" style="margin-bottom:14px; max-width:240px;"><label>Tipo de custeio</label>'+tipoSelectHtml+'</div>'
        + '<div style="font-family:var(--font-head); font-size:12px; color:var(--text-muted); margin-bottom:6px;">Pernoites</div>'
        + pernoiteHtml
        + '<div style="font-family:var(--font-head); font-size:12px; color:var(--text-muted); margin:16px 0 6px;">Custeio calculado</div>'
        + rows
        + (calculaDiaria ? '<div class="field" style="margin-top:10px; margin-bottom:0; max-width:340px;"><label>Saiu da missão no meio? Informe a localidade da meia diária de retorno manualmente</label>'
          + '<input class="custeio-override" data-pid="'+pid+'" value="'+esc(override)+'" placeholder="Ex.: SBBR (deixe em branco pra calcular automático pelos voos)"></div>' : '')
        + '</div>';
    }).join('');

    main.innerHTML = viewHeadHtml('Ordem de missão', 'Relatório — <span style="color:var(--amber);">'+esc(order.number)+'</span>', null)

          + '<div class="kpi"><div class="v">R$ '+custeioTotalPorTipo['Diária'].toFixed(2)+'</div><div class="l">Diária</div></div>'
          + '<div class="kpi"><div class="v">R$ '+custeioTotalPorTipo['Comissionamento'].toFixed(2)+'</div><div class="l">Comissionamento</div></div>'
          + '<div class="kpi"><div class="v">R$ '+custeioTotalPorTipo['Gratificação de Representação'].toFixed(2)+'</div><div class="l">Gratificação de Representação</div></div>'
          + '<div class="kpi"><div class="v" style="color:var(--teal);">R$ '+diariaSimuladaTotal.toFixed(2)+'</div><div class="l">Diária simulada (hipótese: todos na Diária)</div></div>'
          + '</div>' : '')
      + '</div>'

      + '<div class="panel"><h3>Relato do comandante</h3>'
      + '<textarea id="report-relato" rows="8" style="width:100%;" placeholder="Relato livre sobre a missão...">'+esc(report.relato||'')+'</textarea>'
      + '<button class="btn btn-amber" id="report-save" style="margin-top:12px;">Salvar relatório</button> '
      + '<button class="btn btn-sm" id="report-pdf" style="margin-top:12px;">Gerar PDF</button>'
      + '</div>'

      + '<div class="panel"><h3>Status da OMIS</h3>'
      + (report.finalizada
        ? '<p style="color:var(--teal); font-weight:600;">✅ Finalizada — Comandante da Aeronave/Missão: '+esc(report.comandanteMissaoId ? profileFull(report.comandanteMissaoId) : '—')+'</p>'
          + '<p class="empty-note">Ainda pode ser editada normalmente. Pra trocar o comandante ou reabrir, clique abaixo.</p>'
          + '<button class="btn btn-sm" id="reopen-finalizar">Alterar comandante / Reabrir</button>'
        : '<p class="empty-note">A OMIS ainda está aberta. Ao finalizar, você escolhe quem foi o Comandante da Aeronave/Missão — esse nome entra no PDF com campo de assinatura.</p>'
          + '<button class="btn btn-sm" id="open-finalizar">Finalizar OMIS</button>')
      + '<div id="finalizar-picker" style="display:none; margin-top:14px; max-width:360px;">'
      + '<div class="field"><label>Comandante da Aeronave/Missão</label><select id="comandante-missao-select">'
        + '<option value="">Selecione…</option>'
        + crewList.map(function(c){
            var pid = typeof c === 'string' ? c : c.profileId;
            var p = byId(S.data.profiles, pid);

    document.getElementById('report-back').addEventListener('click', function(){ S.reportOrderId = null; render(); });

    function wirePernoiteRow(row){
      row.querySelector('.pernoite-remove').addEventListener('click', function(){ row.remove(); });
    }
    main.querySelectorAll('[data-pernoite-row]').forEach(wirePernoiteRow);
    main.querySelectorAll('.add-pernoite').forEach(function(btn){
      btn.addEventListener('click', function(){
        var list = main.querySelector('.pernoite-list[data-pid="'+btn.getAttribute('data-pid')+'"]');
        var wrap = document.createElement('div'); wrap.innerHTML = pernoiteRowHtml({});
        var row = wrap.firstElementChild;
        list.appendChild(row);
        wirePernoiteRow(row);
      });
    });

    function collectReportData(){
      var newPernoites = {};
      var newOverrides = {};
      var newCusteioTipos = {};
      crewList.forEach(function(c){
        var pid = typeof c === 'string' ? c : c.profileId;
        var list = main.querySelector('.pernoite-list[data-pid="'+pid+'"]');
        var entries = Array.from(list.querySelectorAll('[data-pernoite-row]')).map(function(row){
          return {
            localidade: row.querySelector('.pernoite-local').value.trim(),
            from: row.querySelector('.pernoite-from').value,
            to: row.querySelector('.pernoite-to').value
          };
        }).filter(function(e){ return e.localidade || e.from || e.to; });
        newPernoites[pid] = entries;
        var overrideInput = main.querySelector('.custeio-override[data-pid="'+pid+'"]');
        if(overrideInput && overrideInput.value.trim()) newOverrides[pid] = overrideInput.value.trim();
        var tipoSelect = main.querySelector('.custeio-tipo-override[data-pid="'+pid+'"]');
        if(tipoSelect) newCusteioTipos[pid] = tipoSelect.value;
      });
      return { pernoites: newPernoites, custeioOverrides: newOverrides, custeioTipoOverrides: newCusteioTipos, relato: document.getElementById('report-relato').value,
        finalizada: report.finalizada||false, comandanteMissaoId: report.comandanteMissaoId||'' };
    }

    document.getElementById('report-save').addEventListener('click', function(){
      var data = collectReportData();
      S.db.doc('orderReports/'+order.id).set({
        orderId: order.id, pernoites: data.pernoites, custeioOverrides: data.custeioOverrides, custeioTipoOverrides: data.custeioTipoOverrides, relato: data.relato,
        updatedAt: Date.now(), updatedBy: S.profileId
      }, { merge: true }).then(function(){ toast('Relatório salvo.'); }).catch(function(){ toast('Erro ao salvar relatório.'); });
    });

    document.getElementById('report-pdf').addEventListener('click', function(){
      generateReportPdf(order, flights, crewList, collectReportData());
    });

    var openBtn = document.getElementById('open-finalizar');
    var reopenBtn = document.getElementById('reopen-finalizar');
    var picker = document.getElementById('finalizar-picker');
    if(openBtn) openBtn.addEventListener('click', function(){ picker.style.display = 'block'; });
    if(reopenBtn) reopenBtn.addEventListener('click', function(){ picker.style.display = 'block'; });
    var confirmBtn = document.getElementById('confirm-finalizar');
    if(confirmBtn) confirmBtn.addEventListener('click', function(){
      var comandanteId = document.getElementById('comandante-missao-select').value;
      if(!comandanteId){ toast('Selecione o comandante da aeronave/missão.'); return; }
      S.db.doc('orderReports/'+order.id).set({
        orderId: order.id, finalizada: true, comandanteMissaoId: comandanteId,
        finalizadaEm: Date.now(), finalizadaPor: S.profileId
      }, { merge: true }).then(function(){ toast('OMIS finalizada.'); render(); })
        .catch(function(){ toast('Erro ao finalizar OMIS.'); });
    });
  }

  function renderOrderList(el, filter){
    var list = S.data.orders.slice().sort(function(a,b){ return (b.date+b.number).localeCompare(a.date+a.number); });
    if(filter) list = list.filter(function(o){ return (o.number||'').toLowerCase().indexOf(filter)!==-1; });
    if(!list.length){ el.innerHTML = '<p class="empty-note">Nenhuma ordem encontrada.</p>'; return; }
    el.innerHTML = list.map(function(o){
      var rep = S.data.orderReports.find(function(r){ return r.orderId===o.id || r.id===o.id; });
      var finalizada = !!(rep && rep.finalizada);
      var statusBadge = finalizada
        ? '<span class="mono" style="color:var(--teal); font-size:11px; font-weight:700; border:1px solid var(--teal); border-radius:20px; padding:2px 10px;">✅ FINALIZADA</span>'
        : '<span class="mono" style="color:var(--amber); font-size:11px; font-weight:700; border:1px solid var(--amber); border-radius:20px; padding:2px 10px;">ABERTA</span>';
      return '<div class="strip'+(finalizada?'':' pending')+'"><div class="sc sc-lg">'+esc(o.number)+'</div>'
        + '<div class="sc">'+statusBadge+'</div>'
        + '<div class="sc"><span class="sc-label">Data</span>'+fmtDate(o.date)+'</div>'
        + '<div class="sc"><span class="sc-label">Aeronave</span>'+esc(o.registration)+'</div>'
        + '<div class="sc"><span class="sc-label">Missão</span>'+esc(o.missionType)+'</div>'
        + '<div class="sc"><span class="sc-label">Esforço</span>'+esc(o.esforco||'—')+'</div>'
        + '<div class="sc"><span class="sc-label">Indenizável</span>'+esc(o.indenizavel||'—')+'</div>'
        + '<div class="spacer"></div>'
        + '<div class="actions"><button class="btn btn-sm" data-report-order="'+o.id+'">Relatório</button>'
        + '<button class="btn btn-sm" data-pdf-order="'+o.id+'">Gerar PDF</button>'
        + '<button class="btn btn-danger btn-sm" data-del-order="'+o.id+'">Remover</button></div>'
        + '</div>';
    }).join('');
    el.querySelectorAll('[data-report-order]').forEach(function(b){
      b.addEventListener('click', function(){ S.reportOrderId = b.getAttribute('data-report-order'); render(); });
    });
    el.querySelectorAll('[data-pdf-order]').forEach(function(b){
      b.addEventListener('click', function(){ generateOrderPdf(byId(S.data.orders, b.getAttribute('data-pdf-order'))); });
    });
    el.querySelectorAll('[data-del-order]').forEach(function(b){
      wireConfirmDelete(b, function(){ S.db.collection('missionOrders').doc(b.getAttribute('data-del-order')).delete().then(function(){ toast('Ordem removida.'); }).catch(function(){ toast('Erro ao remover ordem.'); }); });
    });
  }

  function generateReportPdf(order, flights, crewList, data){
    if(typeof window.jspdf === 'undefined'){ toast('Gerador de PDF indisponível no momento.'); return; }
    var doc = new window.jspdf.jsPDF({unit:'pt', format:'a4'});
    var W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
    var y = 56;
    try{
      doc.addImage(ESCUDO_B64, 'PNG', 48, 24, 34, 44);
      doc.addImage(BOLACHA_B64, 'PNG', W-48-40, 24, 40, 40);
    }catch(e){}
    doc.setFont('helvetica','bold'); doc.setFontSize(10);
    doc.text('ESQUADRÃO PELICANO', 92, y-6);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(120);
    doc.text('2º/10º GAV — Para que outros possam viver', 92, y+6);
    doc.setTextColor(0);
    y += 18;
    doc.setDrawColor(180); doc.line(48, y, W-48, y); y += 26;
    doc.setFontSize(18); doc.text('RELATÓRIO DE MISSÃO', 48, y);
    doc.setFont('helvetica','normal'); doc.setFontSize(11);
    doc.text(order.number, W-48, y-8, {align:'right'}); y += 26;

    function ensureSpace(needed){
      if(y + needed > H - 60){ doc.addPage(); y = 56; }
    }
    function sectionTitle(t){
      ensureSpace(34);
      doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(0);
      doc.text(t.toUpperCase(), 48, y);
      doc.setDrawColor(210); doc.line(48, y+4, W-48, y+4);
      y += 22;
    }

    sectionTitle('Voos vinculados a esta OMIS');
    if(!flights.length){
      doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.text('Nenhum voo registrado com este número de OMIS.', 48, y); y += 18;
    } else {
      doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(120);
      var tblLeft = 48, tblRight = W-48, tblW = tblRight - tblLeft;
      var colW = { DATA:0.13, MAT:0.12, DEP:0.18, ARR:0.18, EET:0.11, COMB:0.14, LUB:0.14 };
      var colOrder = ['DATA','MAT','DEP','ARR','EET','COMB','LUB'];
      var colLabel = { DATA:'DATA', MAT:'MATRÍCULA', DEP:'DEP', ARR:'ARR', EET:'EET', COMB:'COMB.', LUB:'LUB.' };
      var colCenter = {}, cx = tblLeft;
      colOrder.forEach(function(k){ var w = colW[k]*tblW; colCenter[k] = cx + w/2; cx += w; });
      doc.setFontSize(8);
      colOrder.forEach(function(k){ doc.text(colLabel[k], colCenter[k], y, {align:'center'}); });
      doc.setTextColor(0); y += 12;
      doc.setFontSize(8.5);
      flights.forEach(function(f){
        ensureSpace(14);
        doc.text(fmtDate(f.date), colCenter.DATA, y, {align:'center'});
        doc.text(f.registration||'—', colCenter.MAT, y, {align:'center'});
        doc.text((f.origin||'—')+' '+(f.takeoff||'—'), colCenter.DEP, y, {align:'center'});
        doc.text((f.destination||'—')+' '+(f.landing||'—'), colCenter.ARR, y, {align:'center'});
        doc.text(fmtDuration(f.durationMin), colCenter.EET, y, {align:'center'});
        doc.text(String(f.combustivel||'—'), colCenter.COMB, y, {align:'center'});
        doc.text(String(f.lubrificante||'—'), colCenter.LUB, y, {align:'center'});
        y += 13;
      });
      y += 8;
      var sumNum = function(key){ return flights.reduce(function(s,f){ var n=parseFloat(String(f[key]||'').replace(',','.')); return s+(isNaN(n)?0:n); }, 0); };
      ensureSpace(14);
      doc.setFont('helvetica','bold'); doc.setFontSize(9.5);
      doc.text('PAX total: '+sumNum('pax')+'   |   Combustível total: '+sumNum('combustivel')+'   |   Lubrificante total: '+sumNum('lubrificante'), 48, y);
      y += 18;
      var horasPorEsforcoPdf = {};
      flights.forEach(function(f){ var k=f.missionType||'(sem esforço)'; horasPorEsforcoPdf[k]=(horasPorEsforcoPdf[k]||0)+(f.durationMin||0); });
      var esforcoKeysPdf = Object.keys(horasPorEsforcoPdf).sort(function(a,b){ return horasPorEsforcoPdf[b]-horasPorEsforcoPdf[a]; });
      if(esforcoKeysPdf.length){
        ensureSpace(14+esforcoKeysPdf.length*13);
        doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.text('Horas por esforço:', 48, y); y += 14;
        doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
        esforcoKeysPdf.forEach(function(k){
          ensureSpace(13);
          doc.text(k+': '+fmtDuration(horasPorEsforcoPdf[k]), 58, y);
          y += 13;
        });
      }
      y += 10;
    }

    sectionTitle('Pernoites da tripulação');
    if(!crewList.length){
      doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.text('Esta ordem não tem tripulação escalada.', 48, y); y += 18;
    } else {
      crewList.forEach(function(c){
        var pid = typeof c === 'string' ? c : c.profileId;
        var entries = (data.pernoites && data.pernoites[pid]) || [];
        ensureSpace(16);
        doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.text(profileFull(pid), 48, y); y += 13;
        doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
        if(!entries.length){
          doc.setTextColor(140); doc.text('Sem pernoite registrado.', 58, y); doc.setTextColor(0); y += 13;
        } else {
          entries.forEach(function(e){
            ensureSpace(13);
            doc.text((e.localidade||'—')+'  —  '+fmtDate(e.from)+' a '+fmtDate(e.to), 58, y);
            y += 13;
          });
        }
        y += 6;
      });
      y += 10;
    }

    sectionTitle('Custeio');
    if(!crewList.length){
      doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.text('Esta ordem não tem tripulação escalada.', 48, y); y += 18;
    } else {
      var custeioOverridesPdf = data.custeioOverrides || {};
      var custeioTipoOverridesPdf = data.custeioTipoOverrides || {};
      var totalGeralPdf = 0, diariaSimuladaPdf = 0;
      var totalPorTipoPdf = { 'Diária':0, 'Comissionamento':0, 'Gratificação de Representação':0 };
      crewList.forEach(function(c){
        var pid = typeof c === 'string' ? c : c.profileId;
        var profile = byId(S.data.profiles, pid);
        if(!profile) return;
        var custeioOriginal = (typeof c === 'string') ? '' : (c.custeio || '');
        var tipo = custeioTipoOverridesPdf[pid] || custeioOriginal;
        var entries = ((data.pernoites && data.pernoites[pid]) || []).filter(function(e){ return e.localidade && e.from && e.to; });
        var override = custeioOverridesPdf[pid] || '';
        var pessoaTotal = 0;
        if(tipo==='Diária' || tipo==='Comissionamento'){
          pessoaTotal = calcularCusteio_(profile, entries, flights, override).total;
        } else if(tipo==='Gratificação de Representação'){
          pessoaTotal = calcularGratRep_(profile, flights).total;
        }
        if(totalPorTipoPdf.hasOwnProperty(tipo)) totalPorTipoPdf[tipo] += pessoaTotal;
        totalGeralPdf += pessoaTotal;
        diariaSimuladaPdf += calcularCusteio_(profile, entries, flights, override).total;
      });
      ensureSpace(70);
      doc.setFont('helvetica','normal'); doc.setFontSize(10);
      doc.text('Diária: R$ '+totalPorTipoPdf['Diária'].toFixed(2), 48, y); y += 14;
      doc.text('Comissionamento: R$ '+totalPorTipoPdf['Comissionamento'].toFixed(2), 48, y); y += 14;
      doc.text('Gratificação de Representação: R$ '+totalPorTipoPdf['Gratificação de Representação'].toFixed(2), 48, y); y += 14;
      doc.setFont('helvetica','bold');
      doc.text('Total geral (real): R$ '+totalGeralPdf.toFixed(2), 48, y); y += 16;
      doc.setFont('helvetica','normal'); doc.setTextColor(120);
      doc.text('Diária simulada (hipótese: todos na Diária): R$ '+diariaSimuladaPdf.toFixed(2), 48, y);
      doc.setTextColor(0); y += 18;
    }

    sectionTitle('Relato do comandante');
    doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
    var relatoLines = doc.splitTextToSize(data.relato || '—', W-96);
    relatoLines.forEach(function(line){ ensureSpace(14); doc.text(line, 48, y); y += 14; });

    if(data.finalizada && data.comandanteMissaoId){
      y += 30; ensureSpace(60);
      doc.setDrawColor(150); doc.line(48, y, 48+220, y);
      y += 14;
      doc.setFont('helvetica','bold'); doc.setFontSize(10);
      doc.text(profileFull(data.comandanteMissaoId), 48, y); y += 13;
      doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(120);
      doc.text('Comandante da Aeronave/Missão', 48, y); doc.setTextColor(0);
      y += 20;
    }

    y += 20; ensureSpace(30);
    doc.setDrawColor(210); doc.line(48, y, W-48, y); y += 18;
    doc.setFontSize(9); doc.setTextColor(120);
    doc.text('Documento gerado pelo Painel Operacional — Esquadrão Pelicano em ' + new Date().toLocaleString('pt-BR'), 48, y);

    var blob = doc.output('blob');
    var filename = 'Relatorio-' + order.number.replace(/[^a-zA-Z0-9-]/g,'') + '.pdf';
    if(S.downloads){
      S.downloads.save({filename: filename, data: blob}).then(function(){ toast('PDF salvo.'); })
        .catch(function(err){
          if(err && err.code === 'declined') return;
          var url = URL.createObjectURL(blob); window.open(url, '_blank');
        });
    } else {
      var url = URL.createObjectURL(blob); window.open(url, '_blank');
    }
  }

  function generateOrderPdf(o){
    if(!o) return;
    if(typeof window.jspdf === 'undefined'){ toast('Gerador de PDF indisponível no momento.'); return; }
    var doc = new window.jspdf.jsPDF({unit:'pt', format:'a4'});
    var W = doc.internal.pageSize.getWidth();
    var y = 56;
    try{
      doc.addImage(ESCUDO_B64, 'PNG', 48, 24, 34, 44);
      doc.addImage(BOLACHA_B64, 'PNG', W-48-40, 24, 40, 40);
    }catch(e){}
    doc.setFont('helvetica','bold'); doc.setFontSize(10);
    doc.text('ESQUADRÃO PELICANO', 92, y-6);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(120);
    doc.text('2º/10º GAV — Para que outros possam viver', 92, y+6);
    doc.setTextColor(0);
    y += 18;
    doc.setDrawColor(180); doc.line(48, y, W-48, y); y+=26;
    doc.setFontSize(18); doc.text('ORDEM DE MISSÃO', 48, y); y+=8;
    doc.setFont('helvetica','normal'); doc.setFontSize(11);
    doc.text(o.number, W-48, y-8, {align:'right'}); y+=26;

    function row(label, value){
      doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.text(label.toUpperCase(), 48, y);
      doc.setFont('helvetica','normal'); doc.setFontSize(11);
      var lines = doc.splitTextToSize(value || '—', W-96);
      doc.text(lines, 48, y+14);
      y += 14 + lines.length*14 + 12;
    }
    row('Data', fmtDate(o.date));
    row('Aeronave', o.registration + (o.modelName ? ' — '+o.modelName : ''));
    row('Tipo de missão', o.missionType);
    row('Esforço aéreo', o.esforco);

    if(o.route && o.route.length){
      doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.text('ROTA DE VOO (UTC)', 48, y); y += 14;
      doc.setFont('helvetica','normal'); doc.setFontSize(9);
      var colX = [48, 100, 160, 210, 270, 330];
      doc.setTextColor(120);
      doc.text('PERNA', colX[0], y); doc.text('ORIGEM', colX[1], y); doc.text('DESTINO', colX[2], y);
      doc.text('ETD', colX[3], y); doc.text('DIST.', colX[4], y); doc.text('TEMPO', colX[5], y);
      doc.setTextColor(0); y += 12;
      o.route.forEach(function(leg, i){
        doc.text(String(i+1), colX[0], y);
        doc.text(leg.origin||'—', colX[1], y);
        doc.text(leg.destination||'—', colX[2], y);
        doc.text(leg.etd||'—', colX[3], y);
        doc.text(leg.distanceNm!=null ? leg.distanceNm+' nm' : '—', colX[4], y);
        doc.text(leg.flightTimeMin!=null ? fmtDuration(leg.flightTimeMin) : '—', colX[5], y);
        y += 13;
      });
      y += 14;
    }

    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.text('TRIPULAÇÃO ESCALADA', 48, y); y += 14;
    if(!o.crew || !o.crew.length){
      doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.text('Não escalada', 48, y); y += 20;
    } else {
      doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(120);
      doc.text('TRIPULANTE', 48, y); doc.text('CUSTEIO', 320, y);
      doc.setTextColor(0); y += 12;
      doc.setFontSize(10.5);
      o.crew.forEach(function(c){
        var name = typeof c === 'string' ? profileFull(c) : profileFull(c.profileId);
        var custeio = typeof c === 'string' ? '—' : c.custeio;
        var lines = doc.splitTextToSize(name, 260);
        doc.text(lines, 48, y);
        doc.text(custeio, 320, y);
        y += Math.max(14, lines.length*13);
      });
      y += 14;
    }

    row('Documento acionador', o.docAcionador);
    row('Indenizável', o.indenizavel);
    row('Objetivo da missão', o.objective);
    row('Detalhes / instruções', o.details);

    var cmt = S.data.profiles.find(function(p){ return profileHasFuncaoAdmin_(p, 'CMT'); });
    var opr = S.data.profiles.find(function(p){ return profileHasFuncaoAdmin_(p, 'OPR'); });
    y += 34;
    var colW = (W-96-40)/2;
    var sigY = y;
    doc.setDrawColor(120);
    doc.line(48, sigY, 48+colW, sigY);
    doc.line(48+colW+40, sigY, 48+colW+40+colW, sigY);
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(0);
    doc.text(cmt ? profileFull(cmt.id) : '—', 48, sigY+14);
    doc.text(opr ? profileFull(opr.id) : '—', 48+colW+40, sigY+14);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(120);
    doc.text('Comandante do 2°/10° GAV', 48, sigY+26);
    doc.text('Chefe da Seção de Operações do 2°/10° GAV', 48+colW+40, sigY+26);
    doc.setTextColor(0);
    y = sigY + 46;

    y += 20;
    doc.setDrawColor(210); doc.line(48, y, W-48, y); y += 18;
    doc.setFontSize(9); doc.setTextColor(120);
    doc.text('Documento gerado pelo Painel Operacional — Esquadrão Pelicano em ' + new Date().toLocaleString('pt-BR'), 48, y);

    var blob = doc.output('blob');
    var filename = 'Ordem-de-Missao-' + o.number.replace(/[^a-zA-Z0-9-]/g,'') + '.pdf';
    if(S.downloads){
      S.downloads.save({filename: filename, data: blob}).then(function(){ toast('PDF salvo.'); })
        .catch(function(err){
          if(err && err.code === 'declined') return;
          // fallback: open in new tab
          var url = URL.createObjectURL(blob); window.open(url, '_blank');
        });
    } else {
      var url = URL.createObjectURL(blob); window.open(url, '_blank');
    }
  }

  /* ---------------- Boot: capabilities + subscriptions ---------------- */
  function subscribeAll(){
    var cols = [
      ['profiles','profiles'], ['aircraftModels','models'], ['aircraft','aircraft'],
      ['flights','flights'], ['unavailability','unavail'], ['missionOrders','orders'],
      ['effortBudgets','effortBudgets'], ['modelEfforts','modelEfforts'], ['customAirports','customAirports'], ['orderReports','orderReports'], ['soldos','soldos'], ['escalasVoo','escalasVoo']
    ];
    S._lastJson = S._lastJson || {};
    S._loadedCollections = S._loadedCollections || {};
    var totalCollections = cols.length;
    function markLoaded(key){
      S._loadedCollections[key] = true;
      if(!S.ready && Object.keys(S._loadedCollections).length >= totalCollections){
        S.ready = true; // só sai da tela de abertura quando TODAS as coleções já chegaram pelo menos uma vez
      }
    }
    cols.forEach(function(pair){
      S.db.collection(pair[0]).onSnapshot(function(snap){
        var newData = snap.docs.filter(function(d){ return d.exists; }).map(function(d){ return Object.assign({id:d.id}, d.data()); });
        if(pair[0]==='flights') newData = newData.filter(function(f){ return !f.deleted; }); // exclusão pendente: já some da tela, mas o sincronizador ainda precisa limpar a planilha
        var newJson = JSON.stringify(newData);
        var changed = newJson !== S._lastJson[pair[1]];
        S._lastJson[pair[1]] = newJson;
        S.data[pair[1]] = newData;
        var wasReady = S.ready;
        markLoaded(pair[1]);
        if(changed || !wasReady){
          var active = document.activeElement;
          var isTyping = active && ['INPUT','TEXTAREA','SELECT'].indexOf(active.tagName) !== -1;
          if(!isTyping) render(); // não redesenha por baixo dos panos só enquanto a pessoa está digitando num campo
          else S._renderPending = true;
        }
      }, function(){ markLoaded(pair[1]); render(); });
    });
  }

  /* ---------------- Firebase (banco de dados em tempo real) ---------------- */
  // Preencha com as credenciais do SEU projeto Firebase (Configurações do projeto → Geral → "Seu app" → Configuração do SDK).
  var firebaseConfig = {
    apiKey: "AIzaSyCcmR_Gx07Xe7o2PZRWoxAx5i2bbDmmvhA",
    authDomain: "pelicapp-210-160e3.firebaseapp.com",
    projectId: "pelicapp-210-160e3",
    storageBucket: "pelicapp-210-160e3.firebasestorage.app",
    messagingSenderId: "798249070962",
    appId: "1:798249070962:web:0f891675230369e55fedeb"
  };

  setInterval(function(){
    if(S._renderPending){
      var active = document.activeElement;
      var isTyping = active && ['INPUT','TEXTAREA','SELECT'].indexOf(active.tagName) !== -1;
      if(!isTyping){ S._renderPending = false; render(); } // aplica a atualização pendente assim que o campo perder o foco
    }
  }, 1000);

  async function boot(){
    render();
    firebase.initializeApp(firebaseConfig);
    S.db = firebase.firestore();
    S.downloads = null; // no navegador comum o PDF abre em nova aba; o usuário salva de lá
    subscribeAll();
    setTimeout(function(){ if(!S.ready){ S.ready = true; render(); } }, 15000); // rede de segurança: nunca trava a tela de abertura para sempre
  }

  boot();
})();
</script>
